<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GEOMETRY II</title>
    <style>
      :root {
        color-scheme: dark;
        --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
        --cyan: #5fd7ff;
        --amber: #ffb14b;
        --edge: #12203a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: #02040a;
        color: #cfe0ff;
        font-family: var(--mono);
        display: grid;
        grid-template-rows: 1fr auto;
        place-items: center;
        overflow: hidden;
        background-image: radial-gradient(
          1200px 700px at 50% -10%,
          rgba(95, 215, 255, 0.06),
          transparent 60%
        );
      }
      .stage {
        position: relative;
        width: min(98vw, calc((100vh - 78px) * 1.6));
        aspect-ratio: 1024/640;
        margin: 12px auto 0;
        display: grid;
        place-items: center;
      }
      .screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 20px;
        overflow: hidden;
        background: #02040a;
        box-shadow:
          inset 0 0 130px rgba(0, 0, 0, 0.92),
          0 0 0 2px #0b1526,
          0 34px 90px -24px #000;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #02040a;
      }
      /* Scanlines, vignette, curvature and chromatic aberration are all done in
         the composite shader; the CRT button toggles them there. */
      .crt-off .screen {
        border-radius: 8px;
      }
      /* ?fullscreen: for a TV, a handheld, or Steam. The frame, the drop shadow
         and the help line all go, and the canvas takes the whole viewport; the
         view letterboxes within it, so an odd panel shape is still correct.
         Which buttons are here at all is main.js's business: CRT and DEV are for
         developing, and SOUND shows only while sound is off, since a pointer is the
         only thing that can unlock the audio device. */
      body.fullscreen {
        grid-template-rows: 1fr;
        background-image: none;
      }
      body.fullscreen .stage {
        width: 100vw;
        height: 100vh;
        margin: 0;
        aspect-ratio: auto;
      }
      body.fullscreen .screen,
      body.fullscreen.crt-off .screen {
        border-radius: 0;
        box-shadow: none;
      }
      body.fullscreen .help,
      body.fullscreen #btnDev {
        display: none;
      }
      .unsupported {
        display: grid;
        place-content: center;
        height: 100%;
        margin: 0;
        text-align: center;
        letter-spacing: 0.1em;
        color: var(--amber);
        font-size: 22px;
        line-height: 2.2;
      }
      .unsupported small {
        color: #8fb2dd;
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      .hud-btns {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 6;
        display: flex;
        gap: 6px;
      }
      .hud-btns button {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.06em;
        color: #8fb2dd;
        background: rgba(10, 20, 38, 0.6);
        border: 1px solid #1c3050;
        border-radius: 6px;
        padding: 5px 9px;
        cursor: pointer;
      }
      .hud-btns button:hover {
        color: #fff;
        border-color: var(--cyan);
      }
      .hud-btns button[aria-pressed="true"] {
        color: #02040a;
        background: var(--cyan);
        border-color: var(--cyan);
      }
      .help {
        font-size: 12px;
        color: #5f79a6;
        letter-spacing: 0.04em;
        padding: 10px 0 14px;
        text-align: center;
        line-height: 1.7;
      }
      .help b {
        color: var(--cyan);
        font-weight: 600;
      }
      .help .sep {
        color: #2c4368;
        margin: 0 8px;
      }
      button:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="screen" id="screen">
        <canvas id="game"></canvas>
      </div>
      <div class="hud-btns">
        <button id="btnCrt" aria-pressed="true" title="CRT filter">CRT</button>
        <button id="btnSnd" aria-pressed="false" title="Sound">SND</button>
        <button id="btnDev" aria-pressed="false" title="Dev: jump to shop, free buys, pick sector">
          DEV
        </button>
      </div>
    </div>
    <p class="help" id="helpKeys">
      <b>WASD</b> fly <span class="sep">/</span> <b>SPACE</b> hold to charge, release to fire
      <span class="sep">/</span> <b>ARROWS</b> aim turret, <b>UP</b> fire <span class="sep">/</span>
      <b>1-4</b> use item <span class="sep">/</span> <b>ENTER</b> start <span class="sep">/</span>
      <b>P</b> pause
    </p>
    <p class="help" id="helpPad" hidden>
      <b>L STICK</b> steer <span class="sep">/</span> <b>RT</b> thrust, <b>LB</b> reverse
      <span class="sep">/</span> <b>LT</b> hold to charge, release to fire
      <span class="sep">/</span> <b>R STICK</b> aim turret, <b>RB</b> fire
      <span class="sep">/</span> <b>A B X Y</b> use item <span class="sep">/</span> <b>A</b> /
      <b>START</b> start <span class="sep">/</span> <b>BACK</b> pause
    </p>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
