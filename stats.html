<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GEOMETRY II - STATS</title>
    <style>
      :root {
        color-scheme: dark;
        --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
        --cyan: #5fd7ff;
        --amber: #ffb14b;
        --green: #57e39a;
        --red: #ff5b5b;
        --edge: #1c3050;
        --panel: #070c16;
        --text: #bcd0ee;
        --dim: #7fa0c8;
        --muted: #5f79a6;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 96px;
      }
      body {
        margin: 0;
        background: #02040a;
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.55;
        background-image: radial-gradient(
          1200px 700px at 50% -10%,
          rgba(95, 215, 255, 0.05),
          transparent 60%
        );
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: rgba(2, 4, 10, 0.94);
        border-bottom: 1px solid var(--edge);
        padding: 10px 20px;
        backdrop-filter: blur(6px);
      }
      .bar {
        display: flex;
        align-items: baseline;
        gap: 14px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 13px;
        letter-spacing: 0.2em;
        color: var(--cyan);
        margin: 0;
      }
      h1 span {
        color: var(--muted);
        letter-spacing: 0.06em;
      }
      nav {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      nav a {
        color: var(--dim);
        text-decoration: none;
        border: 1px solid var(--edge);
        border-radius: 5px;
        padding: 3px 8px;
        font-size: 10px;
        letter-spacing: 0.12em;
      }
      nav a:hover {
        color: #fff;
        border-color: var(--cyan);
      }
      input[type="search"] {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text);
        background: rgba(10, 20, 38, 0.75);
        border: 1px solid var(--edge);
        border-radius: 5px;
        padding: 5px 9px;
        min-width: 220px;
      }
      input[type="search"]:focus-visible {
        outline: 1px solid var(--cyan);
      }
      main {
        max-width: 1500px;
        margin: 0 auto;
        padding: 18px 20px 120px;
      }
      section {
        margin: 28px 0;
      }
      h2 {
        font-size: 11px;
        letter-spacing: 0.22em;
        color: var(--cyan);
        border-bottom: 1px solid var(--edge);
        padding-bottom: 6px;
        margin: 0 0 4px;
      }
      h3 {
        font-size: 11px;
        letter-spacing: 0.16em;
        color: var(--amber);
        margin: 18px 0 6px;
      }
      /* A card's own title heads it, so it keeps the top of the card. */
      .card > header h3 {
        margin: 0;
      }
      .note {
        color: var(--muted);
        margin: 6px 0 12px;
        max-width: 105ch;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(430px, 1fr));
        align-items: start;
        gap: 12px;
      }
      .card {
        border: 1px solid var(--edge);
        border-radius: 8px;
        background: var(--panel);
        padding: 12px 14px;
      }
      .card header {
        position: static;
        background: none;
        border: 0;
        padding: 0;
        backdrop-filter: none;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .pairs {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 1px 14px;
      }
      .pairs > b {
        color: var(--muted);
        font-weight: 400;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }
      .pairs > span {
        color: var(--text);
        overflow-wrap: anywhere;
      }
      .sub {
        color: var(--dim);
        border-left: 1px solid var(--edge);
        padding-left: 10px;
        margin: 6px 0 6px 2px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin: 4px 0 2px;
      }
      th,
      td {
        text-align: right;
        padding: 3px 9px 3px 0;
        border-bottom: 1px solid #0e1a2c;
        white-space: nowrap;
      }
      th {
        color: var(--muted);
        font-weight: 400;
        letter-spacing: 0.1em;
        font-size: 10px;
        text-align: right;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      td.wide {
        white-space: normal;
        text-align: left;
      }
      .swatch {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 2px;
        margin-right: 5px;
        vertical-align: -1px;
        border: 1px solid rgba(255, 255, 255, 0.25);
      }
      .tag {
        display: inline-block;
        border: 1px solid var(--edge);
        border-radius: 4px;
        padding: 0 5px;
        margin: 0 3px 3px 0;
        color: var(--dim);
        font-size: 10px;
        letter-spacing: 0.08em;
      }
      .yes {
        color: var(--green);
      }
      .no {
        color: var(--muted);
      }
      details {
        margin: 4px 0;
      }
      summary {
        cursor: pointer;
        color: var(--muted);
        letter-spacing: 0.08em;
        font-size: 10px;
      }
      summary:hover {
        color: var(--cyan);
      }
      pre {
        margin: 6px 0 0;
        padding: 8px 10px;
        background: #040810;
        border: 1px solid var(--edge);
        border-radius: 6px;
        overflow-x: auto;
        color: var(--dim);
        font-size: 10.5px;
        line-height: 1.5;
      }
      svg {
        display: block;
      }
      .banner {
        border: 1px solid var(--red);
        border-radius: 6px;
        padding: 9px 11px;
        margin: 12px 0;
        color: var(--red);
      }
      .banner code {
        color: #fff;
      }
      .hidden {
        display: none !important;
      }
      /* A table with a wide column scrolls inside its card rather than spilling
         out of it. */
      .scroll {
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <h1>GEOMETRY II <span id="source">reading src/</span></h1>
        <input type="search" id="filter" placeholder="filter rows..." spellcheck="false" />
        <span class="note" style="margin: 0" id="counts"></span>
      </div>
      <nav id="nav"></nav>
    </header>
    <main id="page"></main>

    <script type="module">
      // A reference sheet for the game's numbers. Every registry is walked for whatever
      // keys it happens to have, so adding a weapon, an engine, a core, a special, a ship
      // or a tuning value shows up here without this file changing.
      //
      // A throwaway Game answers the questions that need one: a sector's plan, the guns a
      // sector arms a rock with, ore from a shattered rock. It is never stepped, drawn or
      // saved, and nothing here starts a run, which would write over the player's own.

      const page = document.getElementById("page")

      let config, entities, mathlib, palette, Game
      try {
        ;[config, entities, mathlib, palette, { Game }] = await Promise.all([
          import("./src/config.js"),
          import("./src/entities.js"),
          import("./src/math.js"),
          import("./src/palette.js"),
          import("./src/game.js"),
        ])
      } catch (err) {
        document.getElementById("source").textContent = "could not read src/"
        page.innerHTML =
          `<div class="banner">The game's modules could not be imported, and this page is ` +
          `nothing without them. Serve the folder (<code>python3 -m http.server</code>) and open ` +
          `it over http, or launch with <code>--allow-file-access-from-files</code>.<br />` +
          `${String(err)}</div>`
        throw err
      }

      const CONFIG = config.CONFIG
      const PALETTE = palette.PALETTE
      document.getElementById("source").textContent = "src/config.js, entities.js, game.js"

      // A Game to interrogate. Its constructor only fills fields and builds a
      // backdrop; the stored settings it asks for arrive later and are ignored.
      let probe = null
      try {
        probe = new Game()
      } catch (err) {
        page.append(
          el("div", {
            className: "banner",
            textContent: `A Game could not be built, so the measured tables are missing: ${err}`,
          }),
        )
      }

      // ---- rendering ---------------------------------------------------------

      function el(tag, props = {}, ...children) {
        const node = Object.assign(document.createElement(tag), props)
        for (const child of children.flat()) {
          if (child != null && child !== false) {
            node.append(child)
          }
        }
        return node
      }

      const isColour = (v) => typeof v === "string" && /^#[0-9a-f]{3,8}$/i.test(v)
      const num = (v) =>
        Number.isInteger(v) || !Number.isFinite(v) ? String(v) : String(Number(v.toFixed(4)))

      // A value as text, whatever shape it is. A pair of numbers is a range, since
      // that is what the registries use one for.
      function show(value, depth = 0) {
        if (value === null || value === undefined) {
          return el("span", { className: "no", textContent: "-" })
        }
        if (typeof value === "boolean") {
          return el("span", {
            className: value ? "yes" : "no",
            textContent: value ? "YES" : "no",
          })
        }
        if (typeof value === "number") {
          return document.createTextNode(num(value))
        }
        if (isColour(value)) {
          return el(
            "span",
            {},
            el("span", { className: "swatch", style: `background:${value}` }),
            document.createTextNode(value),
          )
        }
        if (typeof value === "string") {
          return document.createTextNode(value)
        }
        if (typeof value === "function") {
          return el(
            "details",
            {},
            el("summary", { textContent: "CODE" }),
            el("pre", { textContent: source(value) }),
          )
        }
        if (value instanceof Set) {
          return show([...value], depth)
        }
        if (Array.isArray(value)) {
          if (value.every((v) => typeof v === "number")) {
            return document.createTextNode(
              value.length === 2
                ? `${num(value[0])} to ${num(value[1])}`
                : value.map(num).join(", "),
            )
          }
          if (depth > 1) {
            return document.createTextNode(`${value.length} entries`)
          }
          return el(
            "span",
            {},
            value.map((v, i) =>
              el("span", {}, i ? document.createTextNode(" / ") : null, show(v, depth + 1)),
            ),
          )
        }
        // a plain object: its own pairs, indented once
        const entries = Object.entries(value)
        if (!entries.length) {
          return el("span", { className: "no", textContent: "{}" })
        }
        if (depth > 1) {
          return document.createTextNode(entries.map(([k, v]) => `${k}: ${v}`).join(", "))
        }
        return el(
          "div",
          { className: depth ? "sub" : "pairs" },
          depth
            ? entries.map(([k, v]) =>
                el("div", {}, el("b", { textContent: `${k} ` }), show(v, depth + 1)),
              )
            : entries.flatMap(([k, v]) => [
                el("b", { textContent: k }),
                el("span", {}, show(v, depth + 1)),
              ]),
        )
      }

      // Source of a registry's function, with the indentation of its file taken off
      // so it reads at the width it is shown in.
      function source(fn) {
        const text = String(fn)
        const lines = text.split("\n")
        const indents = lines
          .slice(1)
          .filter((line) => line.trim())
          .map((line) => line.match(/^ */)[0].length)
        const strip = indents.length ? Math.min(...indents) : 0
        return lines.map((line, i) => (i ? line.slice(strip) : line)).join("\n")
      }

      // Key/value rows, from whatever keys an object has. `skip` leaves out the
      // ones a caller has already shown its own way.
      function pairs(object, skip = []) {
        const rows = []
        for (const [key, value] of Object.entries(object)) {
          if (skip.includes(key)) {
            continue
          }
          rows.push(el("b", { textContent: key }), el("span", {}, show(value)))
        }
        return el("div", { className: "pairs" }, rows)
      }

      function dataTable(headers, rows) {
        const body = rows.map((row) =>
          el(
            "tr",
            {},
            row.map((cell) =>
              cell && cell.nodeType
                ? el("td", {}, cell)
                : el("td", {
                    textContent: cell === undefined || cell === null ? "-" : String(cell),
                  }),
            ),
          ),
        )
        return el(
          "div",
          { className: "scroll" },
          el(
            "table",
            {},
            el(
              "thead",
              {},
              el(
                "tr",
                {},
                headers.map((h) =>
                  h && h.nodeType ? el("th", {}, h) : el("th", { textContent: h }),
                ),
              ),
            ),
            el("tbody", {}, body),
          ),
        )
      }

      const SECTIONS = []
      function section(id, title, note, ...content) {
        SECTIONS.push({ id, title })
        page.append(
          el(
            "section",
            { id },
            el("h2", { textContent: title }),
            note ? el("p", { className: "note", textContent: note }) : null,
            ...content,
          ),
        )
      }

      function card(title, colour, ...content) {
        return el(
          "div",
          { className: "card" },
          el(
            "header",
            {},
            colour ? el("span", { className: "swatch", style: `background:${colour}` }) : null,
            el("h3", { textContent: title }),
          ),
          ...content,
        )
      }

      function heading(text, ...content) {
        return el("div", {}, el("h3", { textContent: text }), ...content)
      }

      // ---- factions ----------------------------------------------------------

      // The colour the game draws each side in, so a table that mixes them can say
      // whose a row is before it is read. `hazard` is a rock and the wreckage cut off
      // a hull, and takes the colour a cut edge is drawn in.
      const FACTION_INK = {
        player: PALETTE.player.hull,
        rival: PALETTE.rival.hull,
        alien: PALETTE.alien.hull,
        hazard: PALETTE.rock.cut,
      }

      // Who a hull flies for, defaulting the way the simulation does, so a type that
      // states no faction is a rival here as it is there.
      const factionOf = (name) => (config.SHIP_TYPES[name] || {}).faction ?? "rival"

      // A name in a faction's colour, behind a swatch of it where it names the side
      // itself.
      function inFaction(text, faction, swatch = false) {
        const ink = FACTION_INK[faction]
        return el(
          "span",
          { style: ink ? `color:${ink}` : "" },
          swatch && ink ? el("span", { className: "swatch", style: `background:${ink}` }) : null,
          document.createTextNode(text),
        )
      }

      // ---- modules ----------------------------------------------------------

      // Which registry each kind of module lives in. The same map the config keeps
      // for weighing a loadout, kept here because a page reading a loadout entry has
      // the same question: given a field name, what is the thing it names?
      const MODULE_KINDS = {
        weapon: config.WEAPON_TYPES,
        shield: config.SHIELD_TYPES,
        engine: config.ENGINE_TYPES,
        radar: config.RADAR_TYPES,
        thruster: config.THRUSTER_TYPES,
        core: config.CORE_TYPES,
      }

      // The kinds of module a loadout entry names, in the order the entry states
      // them. `withFitted` takes in what a core it carries has in its slots, which
      // is what the entry means on a hardpoint and not what it weighs: a core's own
      // mass is its own, and each fitted module is weighed as an entry of its own.
      function kindsOn(entry, withFitted = true) {
        const found = []
        for (const kind of Object.keys(MODULE_KINDS)) {
          if (entry[kind]) {
            found.push([kind, entry[kind]])
          }
        }
        if (withFitted) {
          for (const [slot, id] of Object.entries(entry.fitted || {})) {
            found.push([slot, id])
          }
        }
        return found
      }

      // A loadout entry as one line: what it mounts, and the settings the entry
      // itself states on top of the module's own.
      function moduleLabel(entry, withFitted = true) {
        const parts = kindsOn(entry, withFitted).map(([kind, id]) => `${kind}: ${id}`)
        if (entry.controller) {
          parts.push(`fired by ${entry.controller}`)
        }
        if (entry.arc !== undefined) {
          parts.push(`bears ${num(entry.arc)} rad`)
        }
        return parts.join(", ") || "-"
      }

      // The colour a hardpoint is drawn in: the module's own where it has one, so a
      // silhouette reads the same way the ship does on screen.
      function moduleColour(entry) {
        for (const [kind, id] of kindsOn(entry)) {
          const type = MODULE_KINDS[kind] && MODULE_KINDS[kind][id]
          if (type && type.colour) {
            return type.colour
          }
        }
        return entry.core ? PALETTE.rival.core : PALETTE.text.muted
      }

      // ---- shapes -----------------------------------------------------------

      // An outline drawn to fit its box, with its shield bubble and everything the
      // loadout mounts marked on it. World units throughout, which is what an
      // outline is in.
      function hullSvg(type, width = 250, height = 150) {
        const points = type.outline
        const reach = Math.max(...points.map(([x, y]) => Math.max(Math.abs(x), Math.abs(y))), 0.1)
        const bubble = shieldRadius(type)
        const scale = (Math.min(width, height) / (Math.max(reach, bubble) * 2)) * 0.9
        const at = ([x, y]) => [width / 2 + x * scale, height / 2 + y * scale]
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg")
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`)
        svg.setAttribute("width", width)
        svg.setAttribute("height", height)
        const add = (name, attrs) => {
          const node = document.createElementNS("http://www.w3.org/2000/svg", name)
          for (const [key, value] of Object.entries(attrs)) {
            node.setAttribute(key, value)
          }
          svg.append(node)
          return node
        }
        const shield = shieldOn(type)
        if (bubble) {
          add("circle", {
            cx: width / 2,
            cy: height / 2,
            r: bubble * scale,
            fill: "none",
            stroke: shield ? config.SHIELD_TYPES[shield].colour : PALETTE.shield.standard,
            "stroke-opacity": 0.25,
            "stroke-dasharray": "5 4",
          })
        }
        add("polygon", {
          points: points.map((p) => at(p).join(",")).join(" "),
          fill: `${type.colour}14`,
          stroke: type.colour,
          "stroke-width": 1.6,
        })
        for (const hp of type.hardpoints || []) {
          const [x, y] = at(hp.local)
          const entry = mountedAt(type, hp).entry
          const colour = entry ? moduleColour(entry) : PALETTE.text.muted
          if (entry && entry.engine) {
            // A chevron pointing the way the plume goes, which is aft.
            add("path", {
              d: `M${x + 4} ${y - 4} L${x - 5} ${y} L${x + 4} ${y + 4}`,
              fill: "none",
              stroke: colour,
              "stroke-opacity": 0.85,
            })
          } else if (entry && entry.core) {
            add("rect", {
              x: x - 3,
              y: y - 3,
              width: 6,
              height: 6,
              fill: "none",
              stroke: colour,
            })
          } else if (entry) {
            add("circle", { cx: x, cy: y, r: 3.4, fill: "none", stroke: colour })
          } else {
            add("circle", { cx: x, cy: y, r: 1.4, fill: PALETTE.ui.slotEmpty })
          }
        }
        return svg
      }

      // Every hull at true relative scale, so the sizes can be compared by eye. One
      // scale for every hull. Each is given a column wide enough for whichever is
      // wider, its silhouette or its label, and the drawing is as wide as that comes
      // to; the SVG then scales the lot to the space it has, which keeps the labels
      // clear of each other however many hulls there are.
      function scaleSvg(hulls, scale = 1.4) {
        const FONT = 11
        const CHAR = FONT * 0.62 // monospace advance, near enough to reserve room
        // How far a hull reaches along each axis, rather than its bound radius: a
        // frigate's corner is three times as far as its flank, and reserving that
        // much height would leave the row mostly empty.
        const spanX = (type) => Math.max(...type.outline.map(([x]) => Math.abs(x)))
        const spanY = (type) => Math.max(...type.outline.map(([, y]) => Math.abs(y)))
        const labelOf = ([name, type]) => `${name} - reach ${num(type.boundRadius)}`
        const columns = hulls.map((entry) => ({
          entry,
          width: Math.max(spanX(entry[1]) * scale * 2 + 30, labelOf(entry).length * CHAR + 18),
        }))
        const tallest = Math.max(...hulls.map(([, type]) => spanY(type))) * scale
        const width = Math.round(columns.reduce((sum, column) => sum + column.width, 0))
        const baseline = tallest * 2 + 24 // every label on the same line, under the tallest
        const height = Math.round(baseline + 6)
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg")
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`)
        svg.setAttribute("width", "100%")
        const add = (tag, attrs, text) => {
          const node = document.createElementNS("http://www.w3.org/2000/svg", tag)
          for (const [key, value] of Object.entries(attrs)) {
            node.setAttribute(key, value)
          }
          if (text !== undefined) {
            node.textContent = text
          }
          svg.append(node)
        }
        let x = 0
        for (const { entry, width: columnWidth } of columns) {
          const [name, type] = entry
          const centre = x + columnWidth / 2
          add("polygon", {
            points: type.outline
              .map(([px, py]) => `${centre + px * scale},${tallest + py * scale}`)
              .join(" "),
            fill: `${type.colour}18`,
            stroke: type.colour,
            "stroke-width": 1.6,
          })
          add(
            "text",
            {
              x: centre,
              y: baseline,
              "text-anchor": "middle",
              // The side's colour, so the row groups by faction before a name is
              // read. The outline keeps the hull's own, which a design may set for
              // itself and need not be its side's.
              fill: FACTION_INK[type.faction ?? "rival"] || PALETTE.text.muted,
              "font-size": FONT,
              "font-family": "monospace",
            },
            labelOf(entry),
          )
          x += columnWidth
        }
        return svg
      }

      // ---- what mounts what -------------------------------------------------

      // The bubble a design flies behind, whether that is mounted on the hull or
      // fitted inside the core, and whichever a rolled arm would put there. Only for
      // drawing one, so the first found answers.
      function shieldOn(type) {
        for (const entry of config.loadoutModules(type)) {
          if (entry.shield) {
            return entry.shield
          }
        }
        for (const entry of Object.values(type.arms || {})) {
          if (entry.shield) {
            return entry.shield
          }
        }
        return null
      }

      // Where the bubble sits, which is the shape's own margin unless the shield
      // wants more room: a field that leans on what comes near it needs somewhere to
      // lean in, and says so with `standoff`.
      function shieldRadius(type) {
        const shield = shieldOn(type)
        const standoff = shield ? config.SHIELD_TYPES[shield].standoff : null
        return (type.bubbleRadius || 0) * (standoff || 1)
      }

      // What a design carries and how it came by it: the loadout it always has, and
      // the arms the spawner may roll onto it. An arm can share a hardpoint with
      // something already there, since a rolled shield goes into the core's shield
      // slot rather than onto a mount of its own.
      function mountsOf(type) {
        const all = []
        for (const entry of type.loadout || []) {
          all.push({ entry, when: "always" })
        }
        for (const [armName, entry] of Object.entries(type.arms || {})) {
          all.push({
            entry,
            armName,
            fitted: !!entry.slot,
            when:
              entry.chancePerSector !== undefined
                ? `rolled as "${armName}", ${entry.chancePerSector}/sector past its spawn sector, up to ${entry.chanceCap}`
                : `rolled as "${armName}"`,
          })
        }
        return { all }
      }

      // What is on one hardpoint. The loadout wins over an arm, since an arm that
      // names an occupied mount is going into a slot inside what is already there.
      function mountedAt(type, hp) {
        const index = (type.hardpoints || []).indexOf(hp)
        const here = mountsOf(type).all.filter((mount) => mount.entry.hp === index)
        return here.find((mount) => mount.when === "always") || here[0] || {}
      }

      // Every place a module name is named, found by walking the registries, so a
      // weapon's card can say who carries it without a list to maintain. The player's
      // is a special case only in that what it carries is bought: EQUIPMENT is walked
      // for the slot a module could be fitted in, and the hull itself for what it
      // came with.
      function mountedBy(kind, name) {
        const found = []
        const check = (entry, where) => {
          if (entry && entry[kind] === name) {
            found.push(where)
          }
          if (entry && entry.fitted && entry.fitted[kind] === name) {
            found.push(where)
          }
        }
        const walkShip = (label, type) => {
          for (const entry of type.loadout || []) {
            check(entry, label)
          }
          for (const [armName, entry] of Object.entries(type.arms || {})) {
            check(entry, `${label} (rolled as "${armName}")`)
          }
        }
        walkShip("player", config.PLAYER_TYPE)
        for (const spec of Object.values(config.EQUIPMENT)) {
          if (spec.mount !== kind) {
            continue
          }
          for (const option of spec.options) {
            if (option.id === name) {
              found.push(`player (${spec.label}: ${option.name})`)
            }
          }
        }
        for (const [shipName, type] of Object.entries(config.SHIP_TYPES)) {
          walkShip(shipName, type)
        }
        for (const hazard of config.HAZARD_TRAITS) {
          const traits = hazard.traits
          if (kind === "shield" && traits.shield && traits.shield.shield === name) {
            found.push(`rock hazard (from sector ${hazard.fromSector})`)
          }
          for (const gun of (traits.gun && traits.gun.guns) || []) {
            if (gun[kind] === name) {
              found.push(
                `rock turret (from sector ${Math.max(hazard.fromSector, gun.fromSector ?? 0)})`,
              )
            }
          }
        }
        return [...new Set(found)]
      }

      // The hulls flying with a named module, as [name, type] so the caller can read
      // whatever the hull worked out with it aboard.
      function carriers(kind, name) {
        return hulls.filter(([, type]) => {
          for (const entry of config.loadoutModules(type)) {
            if (entry[kind] === name) {
              return true
            }
          }
          return false
        })
      }

      function tags(list, empty = "nothing mounts it") {
        return el(
          "div",
          {},
          list.length
            ? list.map((text) => el("span", { className: "tag", textContent: text }))
            : el("span", { className: "no", textContent: empty }),
        )
      }

      // ---- the player's ship, as the shop leaves it -------------------------

      // Which of a hull's mounts a slot fills. A slot names the roles it takes rather
      // than an index, so the same slot finds its mounts on any hull, and every mount
      // with one of those roles is filled.
      const mountsForSlot = (type, spec) =>
        (type.hardpoints || []).flatMap((hp, at) => (spec.roles.includes(hp.role) ? [at] : []))

      // What a slot holds at one of its mounts, answered the way Game.fittedEquipment
      // answers it: a per-mount slot keeps a row, and a mount it says nothing about
      // keeps whatever the hull came with.
      function fittedAt(fitted, slot, spec, ordinal) {
        const held = fitted[slot]
        if (Array.isArray(held)) {
          return held[ordinal]
        }
        if (spec.perMount) {
          return ordinal === 0 ? held : undefined
        }
        return held ?? null
      }

      // The loadout the player flies with for a given set of fitted equipment. This
      // is what PlayerShip.fitEquipment does to the hull, in the shape a type states
      // a loadout in, so the same deriveShipStats that works out a rival answers for
      // the player too. A slot owns its mounts outright, so what it fits takes the
      // place of whatever the hull came with there.
      function playerLoadout(fitted) {
        const type = config.PLAYER_TYPE
        const loadout = (type.loadout || []).map((entry) => ({ ...entry }))
        for (const [slot, spec] of Object.entries(config.EQUIPMENT)) {
          mountsForSlot(type, spec).forEach((at, ordinal) => {
            const id = fittedAt(fitted, slot, spec, ordinal)
            if (id === undefined) {
              return
            }
            if (spec.slot) {
              const core = loadout.find((entry) => entry.hp === at && entry.core)
              if (!core) {
                return
              }
              core.fitted = { ...(core.fitted || {}) }
              if (id) {
                core.fitted[spec.slot] = id
              } else {
                delete core.fitted[spec.slot]
              }
              return
            }
            const already = loadout.findIndex((entry) => entry.hp === at)
            if (already >= 0) {
              loadout.splice(already, 1)
            }
            if (!id) {
              return
            }
            const entry = { hp: at, [spec.mount]: id }
            if (spec.controller) {
              entry.controller = spec.controller
            }
            loadout.push(entry)
          })
        }
        return loadout
      }

      // The flight settings deriveShipStats fills in, asked of flightStats itself so
      // the list is never restated here.
      const FLIGHT_FIELDS = Object.keys(
        config.flightStats({ mass: 1, reach: 1, thrust: 0, torque: 0 }),
      )

      // A derived type back as the design behind it: what deriveShipStats worked out
      // comes off, and what the design stated for itself stays. A stated setting always
      // wins, so refitting a type that has already been through deriveShipStats would
      // otherwise keep the numbers the yard's own loadout came to and report every
      // option as costing nothing.
      function asDesign(type) {
        const design = { ...type }
        for (const field of FLIGHT_FIELDS) {
          if ((type.flightOverrides || {})[field] === undefined) {
            delete design[field]
          }
        }
        return design
      }

      // The player's hull with a set of equipment aboard, worked out the way a rival's
      // type is. The cell is the one exception: the player's core is levelled, so its
      // capacity depends on what has been bought and is asked of coreAt instead.
      function playerAsFitted(fitted, coreLevel = 0) {
        const design = { ...asDesign(config.PLAYER_TYPE), loadout: playerLoadout(fitted) }
        const core = config.coreAt(config.CORE_TYPES[playerCoreName()], coreLevel)
        return {
          ...config.deriveShipStats(design),
          energyMax: core ? core.energy : 0,
          regen: core ? core.regen : 0,
        }
      }

      function playerCoreName() {
        for (const entry of config.PLAYER_TYPE.loadout || []) {
          if (entry.core) {
            return entry.core
          }
        }
        return null
      }

      const FRESH_EQUIPMENT = config.freshEquipment().fitted
      const PLAYER_FITTED = playerAsFitted(FRESH_EQUIPMENT)

      // The equipment slot that would fit a given module, if the shop sells one.
      function playerSlotFor(kind, id) {
        for (const [slot, spec] of Object.entries(config.EQUIPMENT)) {
          if (spec.mount === kind && spec.options.some((option) => option.id === id)) {
            return slot
          }
        }
        return null
      }

      // ---- hulls ------------------------------------------------------------

      // What deriveShipStats fills in, and where each one comes from. A type may
      // state a flight setting for itself, and `flightOverrides` is the record of
      // which: that is the one distinction the simulation itself has to make, since a
      // ship refitted mid-run recomputes what was derived and leaves the rest alone.
      const DERIVED_FIELDS = [
        ["laden", "the bare hull plus everything fitted"],
        ["hull", "armour over the area the outline encloses"],
        ["accel", "thrust over laden mass"],
        ["maxSpeed", "acceleration, times speedPerAccel"],
        ["turnRate", "thruster torque over mass and reach"],
        ["drag", "from laden mass"],
        ["rockContact", "hull points over top speed"],
        ["energyMax", "the core fitted"],
        ["regen", "the core fitted"],
        ["boundRadius", "how far the outline reaches"],
        ["bubbleRadius", "reach, times shieldClearance"],
        ["hullWidth", "reach, from hullWidthBase"],
      ]

      function derivedRows(type) {
        return DERIVED_FIELDS.filter(([field]) => type[field] !== undefined).map(
          ([field, from]) => [
            field,
            num(type[field]),
            (type.flightOverrides || {})[field] !== undefined ? "stated by the design" : from,
          ],
        )
      }

      function massRows(type) {
        const rows = [["bare hull", num(type.mass)]]
        for (const entry of config.loadoutModules(type)) {
          const mass = config.moduleMass(entry)
          if (mass) {
            rows.push([moduleLabel(entry, false), num(mass)])
          }
        }
        rows.push(["laden", num(config.ladenMass(type))])
        return rows
      }

      function hardpointRows(type) {
        const mounts = mountsOf(type).all
        const rows = []
        ;(type.hardpoints || []).forEach((hp, i) => {
          const here = mounts.filter((mount) => mount.entry.hp === i)
          if (!here.length) {
            rows.push([i, hp.role || "-", `${num(hp.local[0])}, ${num(hp.local[1])}`, "-", "empty"])
            return
          }
          here.forEach((mount, k) => {
            rows.push([
              k ? "" : i,
              k ? "" : hp.role || "-",
              k ? "" : `${num(hp.local[0])}, ${num(hp.local[1])}`,
              moduleLabel(mount.entry),
              mount.fitted ? `${mount.when}, into the core's ${mount.entry.slot} slot` : mount.when,
            ])
          })
        })
        return rows
      }

      // The fields shown their own way above, so the catch-all pairs below only has
      // what a design says about itself: what it is for, not what it is made of.
      const HULL_SHOWN = [
        "outline",
        "hardpoints",
        "loadout",
        "arms",
        "colour",
        "flightOverrides",
        "mass",
        ...DERIVED_FIELDS.map(([field]) => field),
      ]

      function hullCard(name, type) {
        return card(
          name,
          type.colour,
          hullSvg(type),
          el("div", { className: "note", style: "margin:6px 0 8px" }, [
            document.createTextNode(
              `hull area ${Math.round(mathlib.polygonArea(type.outline.map(([x, y]) => ({ x, y }))))} square units, ` +
                `thrust ${num(config.thrustOf(type))}, torque ${num(config.torqueOf(type))}` +
                (shieldRadius(type) !== type.bubbleRadius
                  ? `, and a shield that stands off to ${num(shieldRadius(type))}`
                  : ""),
            ),
          ]),
          pairs(type, HULL_SHOWN),
          heading("SETTINGS", dataTable(["field", "value", "where from"], derivedRows(type))),
          heading("WHAT IT WEIGHS", dataTable(["part", "mass"], massRows(type))),
          heading(
            "HARDPOINTS",
            dataTable(["#", "role", "local", "carries", "when"], hardpointRows(type)),
          ),
        )
      }

      const hulls = [["player", PLAYER_FITTED], ...Object.entries(config.SHIP_TYPES)]

      section(
        "hulls",
        "HULLS",
        "One card per ship: the player's, and every entry in SHIP_TYPES, shown as the yard leaves " +
          "it. Outlines are the real ones, with the shield bubble dashed, weapons as rings, engines " +
          "as chevrons, cores as squares and empty mounts as dots. Under TRUE RELATIVE SCALE a hull " +
          "is named in its side's colour, while the outline keeps its own.",
        el(
          "div",
          { className: "cards" },
          hulls.map(([name, type]) => hullCard(name, type)),
        ),
        el("h3", { textContent: "TRUE RELATIVE SCALE" }),
        scaleSvg(hulls),
      )

      // ---- weapons ----------------------------------------------------------

      const rateOf = (reload) =>
        Array.isArray(reload) ? [1 / reload[1], 1 / reload[0]] : [1 / reload, 1 / reload]

      section(
        "weapons",
        "WEAPONS",
        "Every entry in WEAPON_TYPES. Rate, damage and energy per second follow from `reload`. " +
          "`arc` is how far a mount can bear off the hull's facing, and a loadout entry may state " +
          "its own.",
        el(
          "div",
          { className: "cards" },
          Object.entries(config.WEAPON_TYPES).map(([name, type]) => {
            const [slow, fast] = rateOf(type.reload)
            const perSecond = (value) =>
              slow === fast ? num(value * slow) : `${num(value * slow)} to ${num(value * fast)}`
            return card(
              name,
              type.colour,
              pairs(type),
              heading(
                "WORKED OUT",
                el("div", { className: "pairs" }, [
                  el("b", { textContent: "barrels" }),
                  el("span", {}, show(config.barrelCount(type))),
                  el("b", { textContent: "shots/sec" }),
                  el("span", {}, document.createTextNode(perSecond(1))),
                  el("b", { textContent: "damage/sec" }),
                  el("span", {}, document.createTextNode(perSecond(type.damage || 0))),
                  el("b", { textContent: "energy/sec" }),
                  el("span", {}, document.createTextNode(perSecond(type.energy || 0))),
                ]),
              ),
              heading("MOUNTED BY", tags(mountedBy("weapon", name))),
            )
          }),
        ),
      )

      section(
        "shields",
        "SHIELDS",
        "A shield turns damage of the channels it blocks into energy drain, at `efficiency` " +
          "energy per point - one number for every channel, or one per channel. It drops when " +
          "energy falls to `dropAt` of capacity and returns once `recoverDelay` has passed and " +
          "energy is back to `recoverAt`. A shield with `repel` is a field: it pays per push for " +
          "what it holds off, and `solid: false` leans on what it meets instead of stopping it " +
          "dead.",
        el(
          "div",
          { className: "cards" },
          Object.entries(config.SHIELD_TYPES).map(([name, type]) =>
            card(
              name,
              type.colour,
              pairs(type),
              heading("WORN BY", tags(mountedBy("shield", name))),
            ),
          ),
        ),
      )

      // ---- what drives and turns a hull -------------------------------------

      section(
        "engines",
        "ENGINES",
        "What pushes a hull along. thrustOf() adds up the mounts and flightStats divides by what " +
          "the ship weighs. Every engine mounted emits, so two of them read as two streams. " +
          "`reverseAmount` is what one manages backwards, as a fraction of its thrust.",
        el(
          "div",
          { className: "cards" },
          Object.entries(config.ENGINE_TYPES).map(([name, type]) =>
            card(
              name,
              type.colour,
              pairs(type),
              heading(
                "WORKED OUT",
                el("div", { className: "pairs" }, [
                  el("b", { textContent: "reverse thrust" }),
                  el("span", {}, show(type.thrust * (type.reverseAmount ?? 0))),
                ]),
              ),
              heading("MOUNTED BY", tags(mountedBy("engine", name))),
            ),
          ),
        ),
      )

      // Every hull that flies with a given set, at the rate it actually turns at. The
      // player is asked for whichever sets the shop will fit, since a run may choose
      // any of them, and taken off the carriers list so it appears once.
      function thrusterRows(name) {
        const rows = carriers("thruster", name)
          .filter(([hullName]) => hullName !== "player")
          .map(([hullName, type]) => [hullName, type])
        const slot = playerSlotFor("thruster", name)
        if (slot) {
          rows.push(["player", playerAsFitted({ ...FRESH_EQUIPMENT, [slot]: name })])
        }
        return rows.map(([hullName, type]) => [
          hullName,
          num(type.turnRate),
          num(config.TAU / type.turnRate),
        ])
      }

      section(
        "thrusters",
        "MANEUVERING THRUSTERS",
        "The nozzles that bring a hull about, which are core equipment and nothing to do with the " +
          "drive. A set's torque becomes radians a second through SHIP_SCALARS.turnPerReach, so the " +
          "same nozzles turn a dart smartly and barely trouble a slab. The rates below are the ones " +
          "the hulls carrying each set fly at.",
        el(
          "div",
          { className: "cards" },
          Object.entries(config.THRUSTER_TYPES).map(([name, type]) =>
            card(
              name,
              null,
              pairs(type),
              heading(
                "WHAT IT TURNS",
                dataTable(["hull", "rad/sec", "seconds a full turn"], thrusterRows(name)),
              ),
              heading("FITTED BY", tags(mountedBy("thruster", name))),
            ),
          ),
        ),
      )

      // ---- cores ------------------------------------------------------------

      // A levelled core's shop price, taken from the SHOP row that sells it rather
      // than restated: the row states the cost of the step up from each level.
      function coreLevelCost(coreName) {
        const row = config.SHOP.find(
          (entry) => entry.levels && entry.levels === config.CORE_TYPES[coreName].levels,
        )
        return row ? row.levelCost : null
      }

      section(
        "cores",
        "POWER CORES",
        "The plant a hull is built around, and the room it has for what runs off it. A core " +
          "supplies the cell by being fitted; the named slots are what is optional. A core with " +
          "`levels` is one the shop can improve, each level stating the whole plant.",
        el(
          "div",
          { className: "cards" },
          Object.entries(config.CORE_TYPES).map(([name, type]) => {
            const cost = type.levels ? coreLevelCost(name) : null
            return card(
              name,
              PALETTE.rival.core,
              pairs(type, ["levels"]),
              type.levels
                ? heading(
                    "LEVELS",
                    dataTable(
                      ["level", "name", "energy", "regen", "special slots", "next costs"],
                      type.levels.map((level, i) => {
                        const at = config.coreAt(type, i)
                        return [
                          `lv ${i}`,
                          level.name,
                          num(at.energy),
                          num(at.regen),
                          `${Math.min(at.special ?? 0, config.MAX_SLOTS)} of ${config.MAX_SLOTS}`,
                          i < type.levels.length - 1 && cost
                            ? `${cost(i)} ore for lv ${i + 1}`
                            : "the last one",
                        ]
                      }),
                    ),
                    el(
                      "details",
                      {},
                      el("summary", { textContent: "WHAT EACH LEVEL SAYS FOR ITSELF" }),
                      el("pre", {
                        textContent: type.levels
                          .map((level) => `${level.name}\n  ${level.desc}`)
                          .join("\n"),
                      }),
                    ),
                  )
                : null,
              heading("FITTED BY", tags(mountedBy("core", name))),
            )
          }),
        ),
      )

      section(
        "radar",
        "RADAR",
        "What a hull knows about the sector it is in. `sees` is an effective range per kind of " +
          "thing. Every hull sees whatever is within SENSOR_FLOOR (620) of it, radar or not, so a " +
          "set is only worth carrying for what it finds past that. A range is what the hull knows, " +
          "not what it can shoot.",
        el(
          "div",
          { className: "cards" },
          Object.entries(config.RADAR_TYPES).map(([name, type]) =>
            card(name, null, pairs(type), heading("FITTED BY", tags(mountedBy("radar", name)))),
          ),
        ),
      )

      section(
        "factions",
        "FACTIONS",
        "Who shoots at whom. Game.hostileTarget is the only thing that reads this, so every gun " +
          "and every hull that steers at something asks one question. A ship type states its own " +
          "`faction` and is a rival without one; `hazard` is a rock and the wreckage cut off a " +
          "hull. Each side is written in the colour the game draws it in.",
        el(
          "div",
          { className: "cards" },
          card(
            "WHO IS HOSTILE TO WHOM",
            null,
            dataTable(
              ["side", "shoots at", "hulls flying for it"],
              Object.entries(config.FACTIONS).map(([side, hostile]) => {
                const flying = hulls.filter(([, type]) => (type.faction ?? "rival") === side)
                return [
                  inFaction(side, side, true),
                  el(
                    "span",
                    {},
                    hostile.flatMap((other, i) => [
                      i ? document.createTextNode(", ") : null,
                      inFaction(other, other),
                    ]),
                  ),
                  flying.length
                    ? inFaction(flying.map(([name]) => name).join(", "), side)
                    : el("span", { className: "no", textContent: "-" }),
                ]
              }),
            ),
          ),
        ),
      )

      // ---- specials ---------------------------------------------------------

      const SPECIAL_META = ["label", "short", "icon", "colour", "apply"]

      section(
        "specials",
        "SPECIALS",
        "Every entry in SPECIAL_TYPES. `mode` says how it is used: a passive is always on while " +
          "it is fitted, a pulse fires once per press, a toggle runs while it is on and drains, a " +
          "timed one lasts `seconds`, a single is spent. `energy` and `drain` are fractions of the " +
          "cell, since the cell quadruples across the core's levels. Below the divider is what the " +
          "simulation reads off an active one.",
        el(
          "div",
          { className: "cards" },
          Object.entries(config.SPECIAL_TYPES).map(([name, type]) =>
            card(
              `${type.icon}  ${type.label}`,
              type.colour,
              pairs(type, SPECIAL_META),
              probe
                ? el("div", { className: "pairs" }, [
                    el("b", { textContent: "sells for" }),
                    el("span", {}, document.createTextNode(`${probe.specialSellValue(name)} ore`)),
                  ])
                : null,
              config.PLAYER_TYPE.startingSpecials.includes(name)
                ? el("p", {
                    className: "note",
                    style: "margin:6px 0 0",
                    textContent: "The ship leaves the yard with this one fitted.",
                  })
                : null,
              type.apply
                ? el(
                    "details",
                    {},
                    el("summary", { textContent: "WHAT USING IT DOES (CODE)" }),
                    el("pre", { textContent: source(type.apply) }),
                  )
                : el("p", {
                    className: "note",
                    textContent: "no immediate effect; its fields are read while it is active",
                  }),
            ),
          ),
        ),
      )

      // ---- equipment --------------------------------------------------------

      // What one option does to the hull, with everything else left as the yard
      // fitted it: the same ship put through the same deriveShipStats, so a heavier
      // mark costing acceleration shows up as the number it costs.
      function optionEffect(slot, id) {
        return playerAsFitted({ ...FRESH_EQUIPMENT, [slot]: id })
      }

      const EQUIPMENT_EFFECTS = [
        ["laden", "laden mass"],
        ["accel", "accel"],
        ["maxSpeed", "top speed"],
        ["turnRate", "turn"],
        ["drag", "drag"],
      ]

      section(
        "equipment",
        "EQUIPMENT",
        "What the shop fits to the player's ship, slot by slot. Buying an option is permanent and " +
          "swapping between what a run owns is free, so ore buys capability and never a decision. A " +
          "`ladder` slot is climbed in order, since each mark is the one below it and more; the " +
          "rest are a straight choice, and a `removable` slot may be flown empty. The right of each " +
          "table is the hull with that option aboard.",
        el(
          "div",
          { className: "cards" },
          Object.entries(config.EQUIPMENT).map(([slot, spec]) =>
            card(
              spec.label,
              null,
              el("p", { className: "note", style: "margin:0 0 8px", textContent: spec.desc }),
              pairs(spec, ["label", "desc", "options"]),
              heading(
                "OPTIONS",
                dataTable(
                  ["option", "id", "cost", ...EQUIPMENT_EFFECTS.map(([, label]) => label)],
                  spec.options.map((option) => {
                    const fitted = optionEffect(slot, option.id)
                    return [
                      option.name,
                      option.id,
                      option.cost ? `${option.cost} ore` : "the yard's",
                      ...EQUIPMENT_EFFECTS.map(([field]) => num(fitted[field])),
                    ]
                  }),
                ),
              ),
              spec.removable
                ? heading(
                    "FLOWN WITHOUT ONE",
                    dataTable(
                      EQUIPMENT_EFFECTS.map(([, label]) => label),
                      [
                        EQUIPMENT_EFFECTS.map(([field]) =>
                          num(playerAsFitted({ ...FRESH_EQUIPMENT, [slot]: null })[field]),
                        ),
                      ],
                    ),
                  )
                : null,
              el(
                "details",
                {},
                el("summary", { textContent: "WHAT EACH OPTION SAYS FOR ITSELF" }),
                el("pre", {
                  textContent: spec.options
                    .map((option) => `${option.name}\n  ${option.desc}`)
                    .join("\n"),
                }),
              ),
            ),
          ),
        ),
      )

      // ---- shop -------------------------------------------------------------

      // A row's price and state, asked of the row itself with the throwaway game set
      // to each level in turn, so the curve is the one a player pays.
      function levelRows(entry) {
        if (!probe || !entry.levels) {
          return null
        }
        const before = probe.upgrades[entry.id]
        const rows = []
        for (let level = 0; level < entry.levels.length; level++) {
          probe.upgrades[entry.id] = level
          const maxed = entry.maxed(probe)
          rows.push([
            entry.info(probe),
            maxed ? "-" : `${entry.cost(probe)} ore`,
            maxed ? "the last one" : `buys level ${level + 1}`,
          ])
        }
        probe.upgrades[entry.id] = before
        return dataTable(["at", "next costs", ""], rows)
      }

      const shopCards = config.SHOP.map((entry) =>
        card(
          entry.name,
          null,
          el("p", { className: "note", style: "margin:0 0 8px", textContent: entry.desc }),
          el("div", { className: "pairs" }, [
            el("b", { textContent: "id" }),
            el("span", {}, document.createTextNode(entry.id)),
            el("b", { textContent: "what it sells" }),
            el(
              "span",
              {},
              document.createTextNode(
                entry.equipment
                  ? `the ${config.EQUIPMENT[entry.equipment].label} slot, in a pop-over`
                  : entry.levels
                    ? `${entry.levels.length} levels, in a pop-over`
                    : "one purchase, from the row",
              ),
            ),
            ...(entry.inset
              ? [
                  el("b", { textContent: "grouped" }),
                  el(
                    "span",
                    {},
                    document.createTextNode(
                      `inset by ${config.SHOP_LAYOUT.insetBy}, under what carries it`,
                    ),
                  ),
                ]
              : []),
            ...(probe
              ? [
                  el("b", { textContent: "at a fresh run" }),
                  el("span", {}, document.createTextNode(entry.info(probe))),
                  el("b", { textContent: "nothing left to buy" }),
                  el("span", {}, show(entry.maxed(probe))),
                ]
              : []),
            ...(probe && !entry.levels && !entry.equipment
              ? [
                  el("b", { textContent: "cost" }),
                  el("span", {}, document.createTextNode(`${entry.cost(probe)} ore`)),
                ]
              : []),
          ]),
          levelRows(entry),
          entry.equipment
            ? el("p", {
                className: "note",
                style: "margin:8px 0 0",
                textContent: `What the slot can hold, and what each option costs, is under EQUIPMENT.`,
              })
            : null,
        ),
      )

      // Special slots are not a shop row: they come with the power core, since a slot
      // without the cell to run it is not worth selling. What the pop-over on one
      // offers comes from SLOT_MENU.
      shopCards.push(
        card(
          "SPECIAL SLOTS",
          null,
          el("p", {
            className: "note",
            style: "margin:0 0 8px",
            textContent:
              "Not sold on their own. A core level earns a slot, so buying room and buying the " +
              "cell to spend through it are the same purchase. The pop-over on a slot sells and " +
              "fills it.",
          }),
          dataTable(
            ["core level", "slots", "what a slot's pop-over offers"],
            (config.CORE_TYPES[playerCoreName()].levels || []).map((_, i) => {
              const at = config.coreAt(config.CORE_TYPES[playerCoreName()], i)
              return [
                `lv ${i}`,
                `${Math.min(at.special ?? 0, config.MAX_SLOTS)} of ${config.MAX_SLOTS}`,
                config.SLOT_MENU.map((row) => row.name || "one row per special it could hold").join(
                  ", ",
                ),
              ]
            }),
          ),
        ),
      )

      section(
        "shop",
        "UPGRADES AND THE SHOP",
        "One card per SHOP row, in menu order. A row buys one thing outright, steps a levelled " +
          "upgrade, or opens onto an equipment slot.",
        el("div", { className: "cards" }, shopCards),
      )

      // ---- asteroids and ore ------------------------------------------------

      function rockSvg(radius, width = 220, height = 150) {
        const verts = entities.makeAsteroidPolygon(0, 0, radius)
        const reach = Math.max(...verts.map((v) => Math.hypot(v.x, v.y)))
        const scale = (Math.min(width, height) / (reach * 2)) * 0.88
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg")
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`)
        svg.setAttribute("width", width)
        svg.setAttribute("height", height)
        const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon")
        poly.setAttribute(
          "points",
          verts.map((v) => `${width / 2 + v.x * scale},${height / 2 + v.y * scale}`).join(" "),
        )
        poly.setAttribute("fill", "#ffffff08")
        poly.setAttribute("stroke", PALETTE.rock.cut)
        poly.setAttribute("stroke-width", "1.4")
        svg.append(poly)
        const area = mathlib.polygonArea(verts)
        return el(
          "div",
          {},
          svg,
          el("p", {
            className: "note",
            style: "margin:2px 0 0",
            textContent: `radius ${radius}, area ${Math.round(area)}, mass ${num(entities.rockMass(area))}`,
          }),
        )
      }

      // Ore from a whole rock, measured by handing the throwaway game a stub rock
      // and counting what it spawns. The formula is never restated here.
      function measureWholeRockOre(area) {
        if (!probe) {
          return null
        }
        const before = probe.oreChunks.length
        probe.shatterToOre({
          area,
          center: { x: 0, y: 0 },
          boundRadius: Math.sqrt(area / Math.PI),
          vx: 0,
          vy: 0,
        })
        const count = probe.oreChunks.length - before
        probe.oreChunks.length = 0
        probe.particles.length = 0
        return count
      }

      const spawnAreas = (() => {
        const areaOf = (r) => Math.PI * r * r * config.AST_SHAPE.areaFactor
        const [low, high] = config.PROGRESSION.spawn.radius
        return [areaOf(CONFIG.AST_MAX_R * low), areaOf(CONFIG.AST_MAX_R * high)]
      })()

      const oreAreas = [200, 620, 1240, 1860, 2480, 3100, CONFIG.AST_MIN_AREA - 1]
      const wholeAreas = [
        3300,
        6600,
        10000,
        Math.round(spawnAreas[0]),
        16000,
        Math.round(spawnAreas[1]),
      ].sort((x, y) => x - y)

      section(
        "rocks",
        "ASTEROIDS AND ORE",
        "Rock shapes come from makeAsteroidPolygon, freshly rolled each load.",
        el("div", { className: "cards" }, [
          card(
            "SHAPE",
            PALETTE.rock.cut,
            el("div", { style: "display:flex;gap:10px;flex-wrap:wrap" }, [
              rockSvg(CONFIG.AST_MAX_R),
              rockSvg(CONFIG.AST_MAX_R * 0.72),
            ]),
            pairs(config.AST_SHAPE),
            el("p", {
              className: "note",
              textContent: `a sector spawns radii ${num(CONFIG.AST_MAX_R * config.PROGRESSION.spawn.radius[0])} to ${CONFIG.AST_MAX_R}, so areas ${Math.round(spawnAreas[0])} to ${Math.round(spawnAreas[1])}`,
            }),
          ),
          card(
            "ORE FROM A CUT PIECE",
            PALETTE.ore.body,
            el("p", {
              className: "note",
              style: "margin:0 0 6px",
              textContent: `A cut piece under AST_MIN_AREA (${CONFIG.AST_MIN_AREA}) becomes ore at once; anything larger stays a rock to be cut again. Ship plating uses its own, lower threshold of ${config.SHIP_PLATING.minArea}.`,
            }),
            dataTable(
              ["piece area", "chunks", "area per chunk"],
              oreAreas.map((area) => {
                const chunks = entities.oreFromFragment(area)
                return [area, chunks, Math.round(area / chunks)]
              }),
            ),
          ),
          card(
            "ORE FROM A WHOLE ROCK",
            PALETTE.ore.spark,
            el("p", {
              className: "note",
              style: "margin:0 0 6px",
              textContent:
                "What an overdrive shot, or a blast at close range, gets for consuming a rock outright.",
            }),
            dataTable(
              ["rock area", "chunks", "area per chunk"],
              wholeAreas.map((area) => {
                const chunks = measureWholeRockOre(area)
                return [area, chunks, chunks ? Math.round(area / chunks) : "-"]
              }),
            ),
            el("p", {
              className: "note",
              textContent: `a chunk is worth ${CONFIG.ORE_SCORE} score and ${CONFIG.ORE_ENERGY} energy, and expires ${CONFIG.ORE_LIFE}s after it appears`,
            }),
          ),
          card(
            "ARMED AND SHIELDED ROCKS",
            PALETTE.rock.gunShielded,
            el("p", {
              className: "note",
              style: "margin:0 0 6px",
              textContent:
                "A hazard trait joins the roll at its own sector and is weighed against its " +
                "siblings by weightAt. `weightPerSector` makes an entry heavier for each sector " +
                "past that, up to `weightCap`, so a trait can come to crowd the others out.",
            }),
            dataTable(
              ["trait", "from sector", "weight growth", "cap"],
              config.HAZARD_TRAITS.map((hazard) => [
                Object.keys(hazard.traits).sort().join(" + "),
                hazard.fromSector,
                hazard.weightPerSector ? `+${hazard.weightPerSector}/sector` : "flat",
                hazard.weightCap ?? "none",
              ]),
            ),
            pairs({
              AST_ENERGY_SHIELD: CONFIG.AST_ENERGY_SHIELD,
              AST_ENERGY_GUN: CONFIG.AST_ENERGY_GUN,
              AST_REGEN: CONFIG.AST_REGEN,
              BLAST_R: CONFIG.BLAST_R,
              BLAST_DAMAGE: CONFIG.BLAST_DAMAGE,
            }),
          ),
        ]),
      )

      // ---- sectors ----------------------------------------------------------

      // The curve, taken from Game.planLevel itself. What a plan decides at random
      // is measured over many plans rather than recomputed, so the numbers stay
      // true to the code even if the formula behind them changes.
      const SECTOR_SAMPLES = 600
      const LAST_SECTOR = 24

      // The trait combinations HAZARD_TRAITS offers, as the labels a measured mix is
      // counted under, so a new hazard appears in the table without being named here.
      const HAZARD_LABELS = [
        ...new Set(
          config.HAZARD_TRAITS.map((hazard) => Object.keys(hazard.traits).sort().join(" + ")),
        ),
      ]

      function sectorRows() {
        const rows = []
        const mixes = []
        for (let sector = 1; sector <= LAST_SECTOR; sector++) {
          const plan = probe.planLevel(sector)
          let rocks = 0
          let hazardous = 0
          const mix = new Map()
          for (let i = 0; i < SECTOR_SAMPLES; i++) {
            for (const spawn of probe.planLevel(sector).spawns) {
              rocks++
              const keys = Object.keys(spawn.traits)
              if (!keys.length) {
                continue
              }
              hazardous++
              const label = keys.sort().join(" + ")
              mix.set(label, (mix.get(label) || 0) + 1)
            }
          }
          // What an armed rock may be carrying, once armed rocks are rolled at all.
          const armed = config.HAZARD_TRAITS.filter((h) => h.traits.gun)
          const gunFrom = armed.length ? Math.min(...armed.map((h) => h.fromSector)) : Infinity
          const guns =
            sector < gunFrom
              ? []
              : probe.gunsForSector(armed[0].traits.gun, sector).map((entry) => entry.weapon)
          rows.push([
            sector,
            plan.spawns.length,
            `${Math.round((hazardous / Math.max(1, rocks)) * 100)}%`,
            plan.rivals,
            plan.rivals ? `${num(plan.rivalInterval)}s` : "-",
            plan.specials ? "yes" : "no",
            guns.join(", ") || "-",
          ])
          mixes.push([
            sector,
            ...HAZARD_LABELS.map((kind) =>
              hazardous ? `${Math.round(((mix.get(kind) || 0) / hazardous) * 100)}%` : "-",
            ),
          ])
        }
        return { rows, mixes }
      }

      // Which hull a sector's arrivals are rolled from, as the share each takes of
      // whatever is eligible there. Weighed with weightAt, the same call the spawner
      // makes; `maxConcurrent` is left out, since that depends on what is already in
      // the sector rather than on the sector.
      function arrivalRows() {
        const names = Object.keys(config.SHIP_TYPES)
        const rows = []
        for (let sector = 1; sector <= LAST_SECTOR; sector++) {
          const weights = names.map((name) =>
            config.weightAt(config.SHIP_TYPES[name].spawn, sector),
          )
          const total = weights.reduce((sum, weight) => sum + weight, 0)
          rows.push([
            sector,
            ...weights.map((weight) => (total ? `${Math.round((weight / total) * 100)}%` : "-")),
          ])
        }
        return { names, rows }
      }

      if (probe) {
        const { rows, mixes } = sectorRows()
        const arrivals = arrivalRows()
        section(
          "sectors",
          "SECTOR BY SECTOR",
          "Rocks are capped at 14, rivals at 4.",
          dataTable(
            [
              "sector",
              "rocks",
              "hazard chance",
              "hulls at once",
              "arrival gap",
              "specials",
              "rock guns",
            ],
            rows,
          ),
          heading(
            "WHICH HAZARD, WHEN ONE IS ROLLED",
            dataTable(["sector", ...HAZARD_LABELS], mixes),
          ),
          heading(
            "WHICH HULL ARRIVES",
            el("p", {
              className: "note",
              style: "margin:0 0 6px",
              textContent:
                "Each type's share of a sector's arrivals, from weightAt over the eligible types. " +
                "A type is out of the running while as many as its `maxConcurrent` are already " +
                "alive, which depends on the sector's state and so is not in these shares. A " +
                "column is headed in its side's colour.",
            }),
            dataTable(
              ["sector", ...arrivals.names.map((name) => inFaction(name, factionOf(name)))],
              arrivals.rows,
            ),
          ),
        )
      }

      // ---- controls ---------------------------------------------------------

      // A key code as a player would name it. The numpad keeps its own name, since a
      // pad digit and a row digit are two different keys and both are bound.
      const keyName = (code) =>
        String(code)
          .replace(/^Numpad/, "NUM ")
          .replace(/^(Key|Digit|Arrow)/, "") || code

      // A default binding as the device names it. A pad button is given its face
      // label where it has one, since that is what the HUD shows.
      function bindingText(device, value) {
        if (value === undefined) {
          return "-"
        }
        if (device.id === "keys") {
          return value.map(keyName).join(" or ")
        }
        const label = config.GAMEPAD.slotLabels[value]
        return `button ${value}${label ? ` (${label})` : ""}`
      }

      section(
        "controls",
        "CONTROLS",
        "The ship controls a player may rebind, in menu order, with each device's default. An " +
          "action with no entry for a device does not appear in that device's section: a pad steers " +
          "with a stick, so there is nothing to bind for turning.",
        dataTable(
          [
            "action",
            "name",
            ...config.BINDING_DEVICES.map((device) => device.name.toLowerCase()),
            "special slot",
          ],
          config.BINDABLE_CONTROLS.map((action) => [
            action.id,
            action.name,
            ...config.BINDING_DEVICES.map((device) =>
              bindingText(device, action.defaults[device.id]),
            ),
            action.slot !== undefined ? action.slot + 1 : "-",
          ]),
        ),
        el("div", { className: "cards" }, [
          card("GAMEPAD", null, pairs(config.GAMEPAD)),
          card(
            "NOT BINDABLE",
            null,
            el("p", {
              className: "note",
              style: "margin:0 0 6px",
              textContent:
                "Menu navigation and pause are fixed, so a rebind can never leave a player unable to reach the menu and put it back.",
            }),
            el("div", { className: "pairs" }, [
              el("b", { textContent: "reserved keys" }),
              el("span", {}, show([...config.RESERVED_KEYS].map(keyName))),
              el("b", { textContent: "reserved buttons" }),
              el("span", {}, show([...config.RESERVED_BUTTONS])),
            ]),
          ),
          card(
            "DEVICES AND HUD SCALES",
            null,
            el("div", { className: "pairs" }, [
              ...config.BINDING_DEVICES.flatMap((device) => [
                el("b", { textContent: device.id }),
                el("span", {}, document.createTextNode(`${device.name} - "${device.prompt}"`)),
              ]),
              el("b", { textContent: "UI_SCALES" }),
              el("span", {}, show(config.UI_SCALES)),
            ]),
          ),
        ]),
      )

      // ---- everything else --------------------------------------------------

      section(
        "tuning",
        "TUNING",
        "Every value in CONFIG, in the order the file states them. Use the filter at the top to " +
          "find one.",
        pairs(CONFIG),
      )

      section(
        "scalars",
        "HOW A SHIP'S SETTINGS ARE WORKED OUT",
        "The relationships that turn a design into a ship, and the material a hull is made of. A " +
          "design states an outline, mass and armour and bolts modules to it; these turn that into " +
          "how it flies and how much it can take. flightStats is called again whenever what is " +
          "aboard changes.",
        el("div", { className: "cards" }, [
          card("SHIP_SCALARS", null, pairs(config.SHIP_SCALARS)),
          card("SHIP_PLATING", null, pairs(config.SHIP_PLATING)),
          card("flightStats", null, el("pre", { textContent: source(config.flightStats) })),
          card("deriveShipStats", null, el("pre", { textContent: source(config.deriveShipStats) })),
          card("hullPoints", null, el("pre", { textContent: source(config.hullPoints) })),
          card("ladenMass", null, el("pre", { textContent: source(config.ladenMass) })),
          card("weightAt", null, el("pre", { textContent: source(config.weightAt) })),
        ]),
      )

      section(
        "controllers",
        "FIRING BEHAVIOURS",
        "The controller a loadout entry names decides when a mounted weapon fires. Each is called " +
          "once a frame for a ready weapon; the code is the whole definition.",
        el(
          "div",
          { className: "cards" },
          Object.entries(entities.WEAPON_CONTROLLERS).map(([name, fn]) =>
            card(name, null, el("pre", { textContent: source(fn) })),
          ),
        ),
      )

      section(
        "arena",
        "ARENA AND VIEW",
        "The play field is a circle larger than the viewport; the camera follows the ship and the " +
          "boundary confines it.",
        el("div", { className: "cards" }, [
          card(
            "ARENA",
            null,
            pairs({ ...config.ARENA, VIEW_W: config.VIEW_W, VIEW_H: config.VIEW_H }),
          ),
          card("PROGRESSION", null, pairs(config.PROGRESSION)),
        ]),
      )

      section(
        "palette",
        "PALETTE",
        "Every colour the player sees is named here, so retheming is a single-file edit and related " +
          "elements stay in step.",
        el(
          "div",
          { className: "cards" },
          Object.entries(PALETTE).map(([group, value]) =>
            card(
              group,
              typeof value === "string" ? value : null,
              pairs(typeof value === "string" ? { [group]: value } : value),
            ),
          ),
        ),
      )

      // ---- nav and filter ---------------------------------------------------

      const nav = document.getElementById("nav")
      for (const { id, title } of SECTIONS) {
        nav.append(el("a", { href: `#${id}`, textContent: title }))
      }

      // Everything the filter can hide, with the text it matches against and the
      // section it belongs to gathered once, so typing stays instant and a section
      // is judged on the rows the filter actually governs.
      const filterable = []
      const add = (node, also) =>
        filterable.push({
          node,
          also,
          text: node.textContent.toLowerCase(),
          section: node.closest("section"),
        })
      for (const node of page.querySelectorAll(
        "section > .cards > .card, section table tbody tr",
      )) {
        add(node)
      }
      for (const node of page.querySelectorAll("section > .pairs > b")) {
        add(node, node.nextElementSibling)
      }

      const sections = new Map()
      for (const item of filterable) {
        if (!sections.has(item.section)) {
          sections.set(item.section, [])
        }
        sections.get(item.section).push(item)
      }

      const counts = document.getElementById("counts")
      const total = filterable.length
      function applyFilter(text) {
        const needle = text.trim().toLowerCase()
        let shown = 0
        for (const item of filterable) {
          const hit = !needle || item.text.includes(needle)
          item.node.classList.toggle("hidden", !hit)
          if (item.also) {
            item.also.classList.toggle("hidden", !hit)
          }
          item.hit = hit
          shown += hit ? 1 : 0
        }
        for (const [node, items] of sections) {
          node.classList.toggle("hidden", !items.some((item) => item.hit))
        }
        counts.textContent = needle ? `${shown} of ${total} rows` : `${total} rows`
      }
      const filter = document.getElementById("filter")
      filter.addEventListener("input", () => applyFilter(filter.value))
      applyFilter("")
    </script>
  </body>
</html>
