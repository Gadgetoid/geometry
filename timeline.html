<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GEOMETRY II - SECTOR TIMELINE</title>
    <style>
      :root {
        color-scheme: dark;
        --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
        --cyan: #5fd7ff;
        --amber: #ffb14b;
        --red: #ff5b5b;
        --edge: #1c3050;
        --panel: #070c16;
        --grid: #12203a;
        --text: #bcd0ee;
        --dim: #7fa0c8;
        --muted: #5f79a6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #02040a;
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.55;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: rgba(2, 4, 10, 0.94);
        border-bottom: 1px solid var(--edge);
        padding: 10px 20px;
        backdrop-filter: blur(6px);
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 13px;
        letter-spacing: 0.2em;
        color: var(--cyan);
        margin: 0;
      }
      h1 span {
        color: var(--muted);
        letter-spacing: 0.06em;
      }
      /* One filter row above everything it scopes, so every chart shows the same
         slice of the run. */
      .filters {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        flex-wrap: wrap;
      }
      label {
        color: var(--muted);
        letter-spacing: 0.08em;
        font-size: 10px;
      }
      input[type="number"] {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text);
        background: rgba(10, 20, 38, 0.75);
        border: 1px solid var(--edge);
        border-radius: 5px;
        padding: 4px 6px;
        width: 62px;
      }
      button {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        color: var(--dim);
        background: rgba(10, 20, 38, 0.75);
        border: 1px solid var(--edge);
        border-radius: 5px;
        padding: 4px 8px;
        cursor: pointer;
      }
      button:hover {
        color: #fff;
        border-color: var(--cyan);
      }
      button:focus-visible,
      input:focus-visible,
      svg:focus-visible {
        outline: 1px solid var(--cyan);
        outline-offset: 1px;
      }
      main {
        max-width: 1600px;
        margin: 0 auto;
        padding: 18px 20px 140px;
      }
      section {
        margin: 30px 0;
      }
      h2 {
        font-size: 11px;
        letter-spacing: 0.22em;
        color: var(--cyan);
        border-bottom: 1px solid var(--edge);
        padding-bottom: 6px;
        margin: 0 0 4px;
      }
      h3 {
        font-size: 11px;
        letter-spacing: 0.16em;
        color: var(--amber);
        margin: 18px 0 6px;
      }
      .note {
        color: var(--muted);
        margin: 6px 0 14px;
        max-width: 108ch;
      }
      .scroll {
        overflow-x: auto;
        padding-bottom: 4px;
      }
      svg {
        display: block;
      }
      table {
        border-collapse: collapse;
        margin: 4px 0 2px;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        text-align: right;
        padding: 2px 10px 2px 0;
        border-bottom: 1px solid #0e1a2c;
        white-space: nowrap;
      }
      th {
        color: var(--muted);
        font-weight: 400;
        letter-spacing: 0.1em;
        font-size: 10px;
      }
      /* Only the long table needs its header to follow; on a short one a sticky
         row detaches and lands in the middle of its own body. */
      #table th {
        position: sticky;
        top: 76px;
        background: #02040a;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      .legend {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        margin: 2px 0 10px;
        flex-wrap: wrap;
      }
      .ramp {
        display: flex;
        gap: 2px;
      }
      .ramp i {
        width: 22px;
        height: 9px;
        display: block;
      }
      /* The tooltip is an enhancement: every value it shows is also in the table
         view at the foot of the page. */
      #tip {
        position: fixed;
        z-index: 9;
        pointer-events: none;
        background: rgba(4, 8, 16, 0.97);
        border: 1px solid var(--edge);
        border-radius: 6px;
        padding: 6px 9px;
        color: var(--text);
        max-width: 320px;
        display: none;
        box-shadow: 0 8px 24px -12px #000;
      }
      #tip b {
        color: var(--cyan);
        font-weight: 400;
      }
      #tip .k {
        color: var(--muted);
      }
      .banner {
        border: 1px solid var(--red);
        border-radius: 6px;
        padding: 9px 11px;
        margin: 12px 0;
        color: var(--red);
      }
      .banner code {
        color: #fff;
      }
      .swatch {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 2px;
        margin-right: 4px;
        vertical-align: -1px;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <h1>SECTOR TIMELINE <span id="source">reading src/</span></h1>
        <div class="filters">
          <label for="from">SECTORS</label>
          <input type="number" id="from" min="0" max="100" value="0" />
          <label for="to">TO</label>
          <input type="number" id="to" min="0" max="100" value="100" />
          <button data-range="0,100">ALL</button>
          <button data-range="0,20">EARLY</button>
          <button data-range="1,12">FIRST RUN</button>
          <button data-range="20,60">MID</button>
          <button data-range="60,100">LATE</button>
        </div>
        <span class="note" style="margin: 0" id="status"></span>
      </div>
    </header>
    <main id="page"></main>
    <div id="tip"></div>

    <script type="module">
      // What a run looks like sector by sector, measured by asking the game rather
      // than by restating any of its numbers. Every figure here is either something
      // a sector's plan states outright, or the outcome of calling the same code the
      // game calls and counting what came back.
      //
      // A throwaway Game and Backdrop are built to be asked; neither is stepped,
      // drawn or saved, and nothing in src/ is modified.

      const page = document.getElementById("page")
      const status = document.getElementById("status")

      let config, entities, Game, Backdrop, WORLD_NAMES
      try {
        const [c, e, g, b, source] = await Promise.all([
          import("./src/config.js"),
          import("./src/entities.js"),
          import("./src/game.js"),
          import("./src/background.js"),
          // background.js keeps its world-type names to itself, and a planet only
          // carries the number. The names are read out of the module's own source so
          // the page can say "gas giant" instead of "type 3", and falls back to the
          // number if that line ever moves.
          fetch("./src/background.js").then((r) => (r.ok ? r.text() : "")),
        ])
        config = c
        entities = e
        Game = g.Game
        Backdrop = b.Backdrop
        const match = source.match(/const WORLD = \{([^}]*)\}/)
        WORLD_NAMES = {}
        for (const part of (match ? match[1] : "").split(",")) {
          const [name, value] = part.split(":").map((t) => t.trim())
          if (name) {
            WORLD_NAMES[Number(value)] = name
          }
        }
      } catch (err) {
        document.getElementById("source").textContent = "could not read src/"
        page.innerHTML =
          `<div class="banner">The game's modules could not be imported, and this page is ` +
          `nothing without them. Serve the folder (<code>python3 -m http.server</code>) and open ` +
          `it over http, or launch with <code>--allow-file-access-from-files</code>.<br />` +
          `${String(err)}</div>`
        throw err
      }
      const CONFIG = config.CONFIG
      document.getElementById("source").textContent = "measured from src/game.js"

      const probe = new Game()
      const backdrop = new Backdrop()

      // ---- small DOM helpers -------------------------------------------------

      function el(tag, props = {}, ...children) {
        const node = Object.assign(document.createElement(tag), props)
        for (const child of children.flat()) {
          if (child != null && child !== false) {
            node.append(child)
          }
        }
        return node
      }

      const NS = "http://www.w3.org/2000/svg"
      function svgEl(tag, attrs = {}, text) {
        const node = document.createElementNS(NS, tag)
        for (const [key, value] of Object.entries(attrs)) {
          node.setAttribute(key, value)
        }
        if (text !== undefined) {
          node.textContent = text
        }
        return node
      }

      const SECTIONS = []
      function section(id, title, note, ...content) {
        SECTIONS.push(id)
        const node = el(
          "section",
          { id },
          el("h2", { textContent: title }),
          note ? el("p", { className: "note", textContent: note }) : null,
          ...content,
        )
        page.append(node)
        return node
      }

      const pct = (p) => `${(p * 100).toFixed(p > 0 && p < 0.01 ? 1 : 0)}%`
      const round = (n) => Number(n.toFixed(4))

      // ---- the sequential ramp ----------------------------------------------

      // One hue, stepped in perceptual lightness so the scale is monotonic by
      // construction, converted to sRGB here rather than trusted to a gradient.
      // Magnitude is the only thing colour encodes on this page; identity always
      // comes from the row label beside the strip.
      const RAMP_HUE = 232
      const RAMP_STEPS = 7

      function oklch(L, C, hueDeg) {
        const h = (hueDeg * Math.PI) / 180
        const a = C * Math.cos(h)
        const b = C * Math.sin(h)
        const l_ = L + 0.3963377774 * a + 0.2158037573 * b
        const m_ = L - 0.1055613458 * a - 0.0638541728 * b
        const s_ = L - 0.0894841775 * a - 1.291485548 * b
        const l = l_ ** 3,
          m = m_ ** 3,
          s = s_ ** 3
        const linear = [
          4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
          -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
          -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
        ]
        return `#${linear
          .map((c) => (c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055))
          .map((c) =>
            Math.round(Math.max(0, Math.min(1, c)) * 255)
              .toString(16)
              .padStart(2, "0"),
          )
          .join("")}`
      }

      const RAMP = Array.from({ length: RAMP_STEPS }, (_, i) => {
        const t = i / (RAMP_STEPS - 1)
        return oklch(0.38 + t * 0.47, 0.06 + t * 0.09, RAMP_HUE)
      })

      // Nothing is the surface itself, so an empty sector reads as empty rather than
      // as the bottom of a scale.
      const EMPTY = "#0a1220"
      const rampColour = (t) =>
        t <= 0 ? EMPTY : RAMP[Math.min(RAMP_STEPS - 1, Math.floor(t * RAMP_STEPS))]

      function rampLegend(label, top, format = pct) {
        return el(
          "div",
          { className: "legend" },
          el("span", { textContent: label }),
          el("span", { className: "ramp" }, [
            el("i", { style: `background:${EMPTY}`, title: "none" }),
            ...RAMP.map((colour, i) =>
              el("i", {
                style: `background:${colour}`,
                title: format(((i + 0.5) / RAMP_STEPS) * top),
              }),
            ),
          ]),
          el("span", { textContent: `none, then up to ${format(top)}` }),
        )
      }

      // ---- measuring ---------------------------------------------------------

      const LAST = 100
      const PLAN_SAMPLES = 800 // plans per sector, for what a plan rolls
      const RIVAL_SAMPLES = 500 // arrivals per sector, for which type turns up
      const ARM_SAMPLES = 800 // loadout rolls per type per sector

      const HAZARD_KINDS = ["explosive", "shield", "gun", "gun + shield"]
      const RIVAL_NAMES = Object.keys(config.SHIP_TYPES)

      // Rock guns are a pool inside the gun hazard; the trait carrying it, and the
      // sector it joins at, are found rather than assumed.
      const GUN_HAZARDS = config.HAZARD_TRAITS.filter((h) => h.traits.gun)
      const GUN_FROM = GUN_HAZARDS.length
        ? Math.min(...GUN_HAZARDS.map((h) => h.fromSector))
        : Infinity
      const GUN_KINDS = GUN_HAZARDS.length
        ? [...new Set(GUN_HAZARDS.flatMap((h) => h.traits.gun.guns.map((entry) => entry.weapon)))]
        : []

      // Which powerups a sector can drop, measured by asking for some: the picker is
      // the game's, so a weighting added to it would show up here.
      function measurePowerupKinds() {
        const counts = new Map()
        const before = probe.powerupPickups.length
        for (let i = 0; i < 400; i++) {
          probe.spawnPowerup()
          const kind = probe.powerupPickups[probe.powerupPickups.length - 1].type
          counts.set(kind, (counts.get(kind) || 0) + 1)
        }
        probe.powerupPickups.length = before
        const total = [...counts.values()].reduce((a, b) => a + b, 0)
        return [...counts.entries()].map(([kind, n]) => [kind, n / total])
      }

      function surveySector(sector) {
        const plan = probe.planLevel(sector)

        // what a plan rolls: how many rocks carry a hazard, and which
        let rocks = 0
        let hazardous = 0
        const mix = new Map()
        for (let i = 0; i < PLAN_SAMPLES; i++) {
          for (const spawn of probe.planLevel(sector).spawns) {
            rocks++
            const keys = Object.keys(spawn.traits)
            if (!keys.length) {
              continue
            }
            hazardous++
            const label = keys.sort().join(" + ")
            mix.set(label, (mix.get(label) || 0) + 1)
          }
        }

        // which rival arrives, asked of the spawner itself with the field empty, so
        // the maxConcurrent test sees what it sees on a first arrival
        const arrivals = new Map()
        if (plan.rivals > 0) {
          const level = probe.level
          probe.level = sector
          for (let i = 0; i < RIVAL_SAMPLES; i++) {
            probe.rivals.length = 0
            probe.spawnRival()
            const ship = probe.rivals[probe.rivals.length - 1]
            if (ship) {
              arrivals.set(ship.typeName, (arrivals.get(ship.typeName) || 0) + 1)
            }
          }
          probe.rivals.length = 0
          probe.level = level
        }

        // and what one turns up carrying, from the same roll the spawner uses
        const arms = {}
        for (const name of RIVAL_NAMES) {
          const type = config.SHIP_TYPES[name]
          const counts = new Map()
          if (sector >= type.spawn.fromSector) {
            const level = probe.level
            probe.level = sector
            for (let i = 0; i < ARM_SAMPLES; i++) {
              const rolled = probe.rollLoadout(type)
              for (const [armName, entry] of Object.entries(type.arms || {})) {
                if (rolled.includes(entry)) {
                  counts.set(armName, (counts.get(armName) || 0) + 1)
                }
              }
            }
            probe.level = level
          }
          arms[name] = counts
        }

        // the backdrop is seeded by the sector, so this is not a sample but the
        // colours and worlds that sector will always have
        backdrop.regenSector(sector)
        const nebula = { ...backdrop.nebula }
        const planets = backdrop.planets.map((planet) => ({
          r: Math.round(planet.r),
          type: planet.type,
          kind: WORLD_NAMES[planet.type] ?? `type ${planet.type}`,
          base: planet.base,
          hi: planet.hi,
          atmo: planet.atmo,
          emit: planet.emit,
          glows: planet.emit !== "#000000",
        }))

        return {
          sector,
          rocks: plan.spawns.length,
          rivalsAtOnce: plan.rivals,
          arrivalGap: plan.rivals ? plan.rivalInterval : 0,
          powerups: plan.powerups,
          hazardChance: rocks ? hazardous / rocks : 0,
          hazardMix: Object.fromEntries(
            HAZARD_KINDS.map((kind) => [kind, hazardous ? (mix.get(kind) || 0) / hazardous : 0]),
          ),
          // per rock, not per hazard: the chance any given rock is this kind
          hazardPerRock: Object.fromEntries(
            HAZARD_KINDS.map((kind) => [kind, rocks ? (mix.get(kind) || 0) / rocks : 0]),
          ),
          arrivals: Object.fromEntries(
            RIVAL_NAMES.map((name) => [
              name,
              plan.rivals > 0 ? (arrivals.get(name) || 0) / RIVAL_SAMPLES : 0,
            ]),
          ),
          arms: Object.fromEntries(
            RIVAL_NAMES.map((name) => [
              name,
              Object.fromEntries(
                Object.keys(config.SHIP_TYPES[name].arms || {}).map((armName) => [
                  armName,
                  (arms[name].get(armName) || 0) / ARM_SAMPLES,
                ]),
              ),
            ]),
          ),
          guns: GUN_KINDS.filter(
            (weapon) =>
              sector >= GUN_FROM &&
              GUN_HAZARDS.some((h) =>
                probe.gunsForSector(h.traits.gun, sector).some((entry) => entry.weapon === weapon),
              ),
          ),
          nebula,
          planets,
        }
      }

      status.textContent = "measuring..."
      const started = performance.now()
      const SURVEY = []
      for (let sector = 0; sector <= LAST; sector++) {
        SURVEY.push(surveySector(sector))
      }
      const POWERUP_KINDS = measurePowerupKinds()
      const elapsed = Math.round(performance.now() - started)

      // ---- the shared hover layer -------------------------------------------

      const tip = document.getElementById("tip")
      function showTip(event, rows) {
        tip.innerHTML = rows
          .map(([key, value]) =>
            key === null ? `<b>${value}</b>` : `<span class="k">${key}</span> ${value}`,
          )
          .join("<br />")
        tip.style.display = "block"
        const box = tip.getBoundingClientRect()
        const x = Math.min(event.clientX + 14, window.innerWidth - box.width - 8)
        const y = Math.min(event.clientY + 14, window.innerHeight - box.height - 8)
        tip.style.left = `${Math.max(8, x)}px`
        tip.style.top = `${Math.max(8, y)}px`
      }
      const hideTip = () => {
        tip.style.display = "none"
      }
      window.addEventListener("scroll", hideTip, { passive: true })

      // Every strip resolves the sector under the cursor from its x position, so
      // there is no dead space between cells to miss.
      function trackable(svg, geometry, describe) {
        const resolve = (event) => {
          const box = svg.getBoundingClientRect()
          const scale = geometry.width / box.width
          const x = (event.clientX - box.left) * scale - geometry.left
          const index = Math.floor(x / geometry.cell)
          return geometry.sectors[index] ?? null
        }
        const move = (event) => {
          const entry = resolve(event)
          if (!entry) {
            hideTip()
            return
          }
          svg.dataset.cursor = String(entry.sector)
          showTip(event, describe(entry, event))
        }
        svg.addEventListener("mousemove", move)
        svg.addEventListener("mouseleave", hideTip)
        // Keyboard reaches the same readout as hover.
        svg.tabIndex = 0
        let cursor = 0
        svg.addEventListener("keydown", (event) => {
          const step = event.key === "ArrowRight" ? 1 : event.key === "ArrowLeft" ? -1 : 0
          if (!step) {
            return
          }
          event.preventDefault()
          cursor = Math.max(0, Math.min(geometry.sectors.length - 1, cursor + step))
          const entry = geometry.sectors[cursor]
          const box = svg.getBoundingClientRect()
          const at = {
            clientX:
              box.left +
              ((geometry.left + (cursor + 0.5) * geometry.cell) / geometry.width) * box.width,
            clientY: box.top + 20,
          }
          showTip(at, describe(entry, at))
        })
        svg.addEventListener("blur", hideTip)
        return svg
      }

      // ---- charts ------------------------------------------------------------

      const LABEL_W = 168
      const CELL = 12
      const ROW_H = 15

      // Where the run stops changing. Every sector past this one plans the same
      // thing as the last, so this is the whole of the difficulty curve: found by
      // walking back from the end while the signature still matches, rather than
      // from any one cap, so it accounts for all of them at once.
      //
      // Only what a plan states is compared. The sampled shares are consequences of
      // the same gates and settle earlier, but they wobble by a point between
      // samples, and a signature built on them never matches twice.
      function plateauSector() {
        const signature = (entry) =>
          [
            entry.rocks,
            entry.rivalsAtOnce,
            entry.arrivalGap,
            entry.powerups,
            entry.guns.join(" "),
          ].join("|")
        const last = signature(SURVEY[SURVEY.length - 1])
        let first = SURVEY.length - 1
        while (first > 0 && signature(SURVEY[first - 1]) === last) {
          first--
        }
        return SURVEY[first].sector
      }
      const PLATEAU = plateauSector()

      // A hairline where the curve flattens, so the tail reads as "nothing further"
      // rather than as unread detail.
      function plateauRule(parent, sectors, left, y, height, { label = false, cell = CELL } = {}) {
        const index = sectors.findIndex((entry) => entry.sector === PLATEAU)
        if (index < 0) {
          return
        }
        const x = left + index * cell - 1
        parent.append(svgEl("line", { x1: x, x2: x, y1: y, y2: y + height, stroke: "#3a5a86" }))
        if (!label) {
          return
        }
        // Named once, on the first chart. A backing block rather than an outline, so
        // it stays readable where it crosses a full-height bar.
        const text = `nothing changes past ${PLATEAU}`
        parent.append(
          svgEl("rect", {
            x: x + 3,
            y: y + 1,
            width: text.length * 5.45 + 6,
            height: 11,
            rx: 2,
            fill: "#02040a",
          }),
        )
        parent.append(
          svgEl(
            "text",
            { x: x + 6, y: y + 9.5, fill: "#7fa0c8", "font-size": 9, "font-family": "monospace" },
            text,
          ),
        )
      }

      function sectorAxis(parent, sectors, left, y, cell = CELL) {
        for (let i = 0; i < sectors.length; i++) {
          const sector = sectors[i].sector
          const every = sectors.length > 40 ? 10 : sectors.length > 12 ? 5 : 1
          if (sector % every !== 0) {
            continue
          }
          const x = left + (i + 0.5) * cell
          parent.append(
            svgEl("line", {
              x1: x,
              x2: x,
              y1: y,
              y2: y + 3,
              stroke: "#1c3050",
            }),
          )
          parent.append(
            svgEl(
              "text",
              {
                x,
                y: y + 14,
                "text-anchor": "middle",
                fill: "#5f79a6",
                "font-size": 9,
                "font-family": "monospace",
              },
              String(sector),
            ),
          )
        }
      }

      // A grid of rows, each a magnitude over the sectors. Colour is the only thing
      // carrying the value, so a scale legend and the table view come with it.
      function heatGrid(sectors, rows, { format = pct, valueOf, legend } = {}) {
        const top = Math.max(
          ...SURVEY.flatMap((entry) => rows.map((row) => valueOf(row, entry))),
          1e-6,
        )
        const width = LABEL_W + sectors.length * CELL + 12
        const height = rows.length * ROW_H + 24
        const svg = svgEl("svg", {
          viewBox: `0 0 ${width} ${height}`,
          width,
          height,
          role: "img",
        })
        rows.forEach((row, r) => {
          svg.append(
            svgEl(
              "text",
              {
                x: LABEL_W - 10,
                y: r * ROW_H + 11,
                "text-anchor": "end",
                fill: row.emphasis ? "#bcd0ee" : "#7fa0c8",
                "font-size": 10,
                "font-family": "monospace",
              },
              row.label,
            ),
          )
          sectors.forEach((entry, i) => {
            const value = valueOf(row, entry)
            // A 2px gap between cells instead of a border around each one.
            svg.append(
              svgEl("rect", {
                x: LABEL_W + i * CELL,
                y: r * ROW_H,
                width: CELL - 2,
                height: ROW_H - 3,
                rx: 2,
                fill: rampColour(value / top),
              }),
            )
          })
        })
        plateauRule(svg, sectors, LABEL_W, 0, rows.length * ROW_H - 3)
        sectorAxis(svg, sectors, LABEL_W, rows.length * ROW_H)
        trackable(svg, { width, left: LABEL_W, cell: CELL, sectors }, (entry) => [
          [null, `SECTOR ${entry.sector}`],
          ...rows.map((row) => [row.label, format(valueOf(row, entry))]),
        ])
        return el(
          "div",
          {},
          legend ? rampLegend(legend, top, format) : null,
          el("div", { className: "scroll" }, svg),
        )
      }

      // Magnitude over time where the number itself matters: a column per sector,
      // ends rounded and anchored to the baseline.
      function columns(
        sectors,
        valueOf,
        { height = 92, colour = RAMP[4], format = String, label = false } = {},
      ) {
        const width = LABEL_W + sectors.length * CELL + 12
        const top = 8
        const plot = height - 24
        const peak = Math.max(1, ...sectors.map(valueOf))
        const svg = svgEl("svg", { viewBox: `0 0 ${width} ${height}`, width, height, role: "img" })
        for (const fraction of [0, 0.5, 1]) {
          const y = top + plot * (1 - fraction)
          svg.append(
            svgEl("line", { x1: LABEL_W, x2: width - 12, y1: y, y2: y, stroke: "#12203a" }),
          )
          svg.append(
            svgEl(
              "text",
              {
                x: LABEL_W - 10,
                y: y + 3,
                "text-anchor": "end",
                fill: "#5f79a6",
                "font-size": 9,
                "font-family": "monospace",
              },
              format(round(peak * fraction)),
            ),
          )
        }
        sectors.forEach((entry, i) => {
          const value = valueOf(entry)
          const h = (value / peak) * plot
          if (h <= 0) {
            return
          }
          svg.append(
            svgEl("rect", {
              x: LABEL_W + i * CELL,
              y: top + plot - h,
              width: CELL - 2,
              height: h,
              rx: Math.min(4, (CELL - 2) / 2),
              fill: colour,
            }),
          )
        })
        plateauRule(svg, sectors, LABEL_W, top, plot, { label })
        sectorAxis(svg, sectors, LABEL_W, top + plot)
        return trackable(svg, { width, left: LABEL_W, cell: CELL, sectors }, (entry) => [
          [null, `SECTOR ${entry.sector}`],
          ["value", format(round(valueOf(entry)))],
        ])
      }

      // The backdrop strip. These are not an encoding: they are the colours the
      // sector is actually drawn in, taken from the seeded generator, so a swatch is
      // the thing itself rather than a value on a scale.
      function backdropStrip(sectors) {
        const width = LABEL_W + sectors.length * CELL + 12
        const nebulaH = 26
        const planetH = 34
        const height = nebulaH + planetH + 24
        const svg = svgEl("svg", { viewBox: `0 0 ${width} ${height}`, width, height, role: "img" })
        const label = (text, y) =>
          svg.append(
            svgEl(
              "text",
              {
                x: LABEL_W - 10,
                y,
                "text-anchor": "end",
                fill: "#7fa0c8",
                "font-size": 10,
                "font-family": "monospace",
              },
              text,
            ),
          )
        label("nebula", 17)
        label("worlds", nebulaH + 20)
        sectors.forEach((entry, i) => {
          const x = LABEL_W + i * CELL
          svg.append(
            svgEl("rect", {
              x,
              y: 0,
              width: CELL - 2,
              height: nebulaH * 0.55,
              fill: entry.nebula.colorA,
            }),
          )
          svg.append(
            svgEl("rect", {
              x,
              y: nebulaH * 0.55,
              width: CELL - 2,
              height: nebulaH * 0.45,
              fill: entry.nebula.colorB,
            }),
          )
          entry.planets.forEach((planet, p) => {
            const cy = nebulaH + 8 + p * 8
            if (cy > nebulaH + planetH - 2) {
              return
            }
            svg.append(
              svgEl("circle", {
                cx: x + (CELL - 2) / 2,
                cy,
                // radius runs 50 to 120 in world units; kept to a few pixels here
                r: 1.6 + (planet.r / 120) * 2.2,
                fill: planet.atmo,
                stroke: planet.glows ? planet.emit : "none",
                "stroke-width": planet.glows ? 1 : 0,
              }),
            )
          })
        })
        sectorAxis(svg, sectors, LABEL_W, nebulaH + planetH)
        return trackable(svg, { width, left: LABEL_W, cell: CELL, sectors }, (entry) => [
          [null, `SECTOR ${entry.sector}`],
          ["nebula", `${swatchText(entry.nebula.colorA)} ${swatchText(entry.nebula.colorB)}`],
          ["worlds", String(entry.planets.length)],
          ...entry.planets.map((planet, i) => [
            `world ${i + 1}`,
            `${swatchText(planet.atmo)} ${planet.kind}, r ${planet.r}${planet.glows ? ", emissive" : ""}`,
          ]),
        ])
      }

      const swatchText = (colour) =>
        `<span class="swatch" style="background:${colour}"></span>${colour}`

      // ---- sections ----------------------------------------------------------

      // Rebuilt on a filter change: one row of controls scopes every chart, so they
      // always show the same slice.
      function render() {
        const from = Math.max(0, Math.min(LAST, Number(document.getElementById("from").value)))
        const to = Math.max(from, Math.min(LAST, Number(document.getElementById("to").value)))
        const sectors = SURVEY.filter((entry) => entry.sector >= from && entry.sector <= to)
        page.textContent = ""
        SECTIONS.length = 0

        // -- milestones
        const firsts = []
        const firstWhere = (label, test) => {
          const found = SURVEY.find(test)
          firsts.push([label, found ? found.sector : null])
        }
        firstWhere("rocks carry a hazard", (e) => e.hazardChance > 0)
        for (const kind of HAZARD_KINDS) {
          firstWhere(`rock hazard: ${kind}`, (e) => e.hazardPerRock[kind] > 0)
        }
        for (const weapon of GUN_KINDS) {
          firstWhere(`rock gun: ${weapon}`, (e) => e.guns.includes(weapon))
        }
        firstWhere("a rival arrives", (e) => e.rivalsAtOnce > 0)
        for (const name of RIVAL_NAMES) {
          firstWhere(`rival: ${name}`, (e) => e.arrivals[name] > 0)
          for (const armName of Object.keys(config.SHIP_TYPES[name].arms || {})) {
            firstWhere(`${name} may carry ${armName}`, (e) => (e.arms[name][armName] || 0) > 0)
          }
        }
        firstWhere("powerups drop", (e) => e.powerups)
        firstWhere("a second rival at once", (e) => e.rivalsAtOnce > 1)
        firstWhere("a third rival at once", (e) => e.rivalsAtOnce > 2)
        firstWhere("the rock count caps", (e) => e.rocks >= config.PROGRESSION.rocks.max)
        firstWhere(
          "the hazard chance caps",
          (e) => e.hazardChance >= config.PROGRESSION.hazards.max,
        )
        firsts.push(["the timeline goes flat, nothing changes after", PLATEAU])

        section(
          "milestones",
          "WHEN THINGS FIRST APPEAR",
          "The first sector each thing can happen in, taken from the measured survey rather than " +
            "from the sector each registry names, so a gate that is reached through two conditions " +
            "is reported where it actually opens.",
          el(
            "div",
            { className: "scroll" },
            el(
              "table",
              {},
              el(
                "tbody",
                {},
                firsts.map(([label, sector]) =>
                  el(
                    "tr",
                    {},
                    el("td", { textContent: label, style: "min-width:280px" }),
                    el("td", {
                      textContent: sector === null ? "never" : `sector ${sector}`,
                      style: `color:${sector === null ? "#5f79a6" : "#bcd0ee"}`,
                    }),
                  ),
                ),
              ),
            ),
          ),
        )

        // -- backdrop
        section(
          "backdrop",
          "SKY",
          "The nebula pair and the worlds each sector is drawn against. The generator is seeded " +
            "by the sector number, so this is not a sample: it is the sky that sector always has. " +
            "The base hue advances 43 degrees a sector, which is why the strip cycles. Swatches " +
            "are the colours themselves, not a scale.",
          el("div", { className: "scroll" }, backdropStrip(sectors)),
        )

        // -- counts
        section(
          "counts",
          "HOW MUCH IS OUT THERE",
          "What a sector's plan states outright. Two measures on two charts rather than two scales " +
            "on one.",
          el("h3", { textContent: "ROCKS IN THE FIELD" }),
          el(
            "div",
            { className: "scroll" },
            columns(sectors, (e) => e.rocks, { label: true }),
          ),
          el("h3", { textContent: "RIVALS ALIVE AT ONCE" }),
          el(
            "div",
            { className: "scroll" },
            columns(sectors, (e) => e.rivalsAtOnce),
          ),
          el("h3", { textContent: "SECONDS BETWEEN ARRIVALS" }),
          el(
            "div",
            { className: "scroll" },
            columns(sectors, (e) => e.arrivalGap, { colour: RAMP[3], format: (n) => `${n}s` }),
          ),
        )

        // -- probabilities
        const hazardRows = [
          { label: "any hazard, per rock", key: "hazardChance", emphasis: true },
          ...HAZARD_KINDS.map((kind) => ({ label: kind, key: kind })),
        ]
        section(
          "hazards",
          "WHAT A ROCK IS CARRYING",
          `The chance any one rock in the sector carries each trait. A plan rolls these, so they ` +
            `are measured over ${PLAN_SAMPLES} plans a sector; the top row is the chance of a ` +
            `hazard at all and the rest are that chance split between the kinds, so the four sum ` +
            `to it. A trait's weight can grow per sector, which is why armed rocks come to crowd ` +
            `the others out.`,
          heatGrid(sectors, hazardRows, {
            legend: "chance a given rock carries it",
            valueOf: (row, entry) =>
              row.key === "hazardChance" ? entry.hazardChance : entry.hazardPerRock[row.key],
          }),
        )

        section(
          "rivals",
          "WHICH RIVAL ARRIVES",
          `Asked of the spawner itself: with the field empty and the run set to that sector, ` +
            `${RIVAL_SAMPLES} arrivals a sector, counted by type. The spawner rolls each gated ` +
            `type in turn and falls back to the one type that claims that slot, so a type's share ` +
            `is not its own chance alone but what is left after the ones rolled before it.`,
          heatGrid(
            sectors,
            RIVAL_NAMES.map((name) => ({ label: name, key: name })),
            { legend: "share of arrivals", valueOf: (row, entry) => entry.arrivals[row.key] },
          ),
          el("h3", { textContent: "AND WHAT IT TURNS UP CARRYING" }),
          el("p", {
            className: "note",
            textContent:
              "Each optional module is rolled on its own as the ship spawns, from the same call the" +
              " spawner makes, so a rival can carry any combination of them.",
          }),
          heatGrid(
            sectors,
            RIVAL_NAMES.flatMap((name) =>
              Object.keys(config.SHIP_TYPES[name].arms || {}).map((armName) => ({
                label: `${name}: ${armName}`,
                name,
                armName,
              })),
            ),
            {
              legend: "chance it arrives carrying it",
              valueOf: (row, entry) => entry.arms[row.name][row.armName] || 0,
            },
          ),
        )

        section(
          "powerups",
          "POWERUPS",
          "Whether a sector drops them at all, and which. The kind is picked by the game's own " +
            "picker, measured over 400 drops, and it does not depend on the sector: what changes " +
            "with the sector is only whether they come at all.",
          heatGrid(sectors, [{ label: "powerups drop", key: "powerups", emphasis: true }], {
            valueOf: (row, entry) => (entry.powerups ? 1 : 0),
            format: (v) => (v ? "yes" : "no"),
          }),
          el("h3", { textContent: "WHICH KIND, WHEN ONE DROPS" }),
          el(
            "div",
            { className: "scroll" },
            el(
              "table",
              {},
              el(
                "thead",
                {},
                el(
                  "tr",
                  {},
                  el("th", { textContent: "powerup" }),
                  el("th", { textContent: "share of drops" }),
                  el("th", { textContent: "at most on the field" }),
                ),
              ),
              el(
                "tbody",
                {},
                POWERUP_KINDS.map(([kind, share]) =>
                  el(
                    "tr",
                    {},
                    el(
                      "td",
                      {},
                      el("span", {
                        className: "swatch",
                        style: `background:${config.POWERUP_TYPES[kind].colour}`,
                      }),
                      document.createTextNode(config.POWERUP_TYPES[kind].label),
                    ),
                    el("td", { textContent: pct(share) }),
                    el("td", { textContent: String(config.PROGRESSION.powerups.maxOnField) }),
                  ),
                ),
              ),
            ),
          ),
        )

        // -- the table view
        const columnsSpec = [
          ["sector", (e) => e.sector],
          ["rocks", (e) => e.rocks],
          ["hazard", (e) => pct(e.hazardChance)],
          ...HAZARD_KINDS.map((kind) => [kind, (e) => pct(e.hazardPerRock[kind])]),
          ["rock guns", (e) => e.guns.join(" ") || "-"],
          ["rivals", (e) => e.rivalsAtOnce],
          ["gap", (e) => (e.arrivalGap ? `${round(e.arrivalGap)}s` : "-")],
          ...RIVAL_NAMES.map((name) => [name, (e) => pct(e.arrivals[name])]),
          ["powerups", (e) => (e.powerups ? "yes" : "no")],
          ["worlds", (e) => e.planets.map((p) => p.kind).join(" ")],
          ["nebula", (e) => e.nebula.colorA],
        ]
        section(
          "table",
          "EVERY NUMBER",
          "The same figures as the strips above, for reading exactly rather than at a glance.",
          el(
            "div",
            { className: "scroll" },
            el(
              "table",
              {},
              el(
                "thead",
                {},
                el(
                  "tr",
                  {},
                  columnsSpec.map(([name]) => el("th", { textContent: name })),
                ),
              ),
              el(
                "tbody",
                {},
                sectors.map((entry) =>
                  el(
                    "tr",
                    {},
                    columnsSpec.map(([, read]) => el("td", { textContent: String(read(entry)) })),
                  ),
                ),
              ),
            ),
          ),
        )

        status.textContent =
          `sectors ${from} to ${to} of 0 to ${LAST}, surveyed in ${elapsed}ms ` +
          `(${PLAN_SAMPLES} plans and ${RIVAL_SAMPLES} arrivals a sector)`
      }

      for (const input of ["from", "to"]) {
        document.getElementById(input).addEventListener("change", render)
      }
      for (const button of document.querySelectorAll("button[data-range]")) {
        button.addEventListener("click", () => {
          const [from, to] = button.dataset.range.split(",")
          document.getElementById("from").value = from
          document.getElementById("to").value = to
          render()
        })
      }
      render()
    </script>
  </body>
</html>
